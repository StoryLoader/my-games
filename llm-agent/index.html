<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM과 AI 에이전트, 처음부터 오늘까지</title>
  <link rel="stylesheet" href="fonts/noto-sans-kr/noto-sans-kr-700.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/fxkit.css">
  <link rel="stylesheet" href="css/typefx.css">
  <link rel="stylesheet" href="css/reckit.css">
  <link rel="stylesheet" href="css/look.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage" data-width="1920" data-height="1080">
    <!-- 밤의 박물관 「AI 역사관」: one long gallery the camera walks along, left to right (storyboard.md) -->
    <div id="wall"></div>      <!-- green wall, panel mouldings, picture rail, wainscot: stays, its pattern slides with the camera -->
    <div id="light"></div>     <!-- the gallery spotlight on the wall in front of the camera -->
    <div id="world"></div>     <!-- the exhibits: one station per stretch of the talk, 2300 px apart -->
    <div id="floor"></div>     <!-- oak floor with the lamp's reflection -->
    <canvas id="fx"></canvas>  <!-- dust in the light, snow in the AI winter -->
    <div id="rope"></div>      <!-- brass posts and a velvet rope close to the camera (moves faster: depth) -->
    <div id="vig"></div>       <!-- vignette -->
    <div id="hud"></div>       <!-- the chapter's question and the year rail -->
    <div id="sfx"></div>
  </div>

  <script src="vendor/gsap/gsap.min.js"></script>
  <script src="vendor/gsap/SplitText.min.js"></script>
  <script src="vendor/gsap/CustomEase.min.js"></script>
  <script src="vendor/gsap/CustomBounce.min.js"></script>
  <script src="vendor/gsap/CustomWiggle.min.js"></script>
  <script src="vendor/gsap/DrawSVGPlugin.min.js"></script>
  <script src="vendor/gsap/MorphSVGPlugin.min.js"></script>
  <script src="vendor/gsap/MotionPathPlugin.min.js"></script>
  <script src="vendor/gsap/TextPlugin.min.js"></script>
  <script src="vendor/gsap/ScrambleTextPlugin.min.js"></script>
  <script src="js/cues.js"></script>
  <script src="js/sync.js"></script>          <!-- measured phrase times (scripts/sync.mjs): cue(id).when() uses them -->
  <script src="js/player.js"></script>
  <script src="js/fxkit.js"></script>          <!-- optional effects kit: FXKit.install(ctx) — references/fx-kit.md -->
  <script src="js/typefx.js"></script>         <!-- expressive typography: TypeFX.install(ctx) — references/type-fx.md -->
  <script src="js/art/core.js"></script>       <!-- illustration modules: add js/art/<group>.js below — references/art-library.md -->
  <script src="js/media-src.js"></script>      <!-- footage: the clips this video shows (empty when none) — references/footage.md -->
  <script src="js/media.js"></script>          <!-- footage on the master clock: MEDIA.install(ctx) -->
  <script src="js/reckit.js"></script>         <!-- screen recordings without zooming: RecKit.install(ctx) -->
  <script src="js/seg/a_intro.js"></script>     <!-- stations: opening, LLM, training -->
  <script src="js/seg/b_history.js"></script>   <!-- stations: 1950 → 2023 -->
  <script src="js/seg/c_agent.js"></script>     <!-- stations: agents, 2023 → 2026, closing -->
  <script src="js/scenes.js"></script>
</body>
</html>
