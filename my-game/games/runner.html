    const energyFill = document.getElementById('energyFill');
    const energyLag = document.getElementById('energyLag');
    const pad = n => String(Math.min(n, 99999)).padStart(5, '0');

    try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}
    bestEl.textContent = pad(best);

    const touchy = matchMedia('(pointer: coarse)').matches;
    hintEl.textContent = touchy
      ? '손가락으로 끌면 그쪽으로 · 톡 누르면 점프 · 치킨 = 에너지'
      : '마우스 쪽으로 달려요 · 클릭 점프 · E 아이템';
    setTimeout(() => hintEl.classList.add('gone'), 5000);

    function renderTrip() {
      const k = Math.min(1, stageDist / STAGES[stage].len);
      tripFill.style.transform = `scaleX(${k})`;
      tripDot.style.left = `${k * 100}%`;
    }
    function renderEnergy() {
      const k = energy / MAX_ENERGY;
      energyFill.style.transform = `scaleX(${k})`;
      energyLag.style.transform = `scaleX(${k})`;
      energyEl.classList.toggle('mid', energy <= 60 && energy > LOW_ENERGY);
      energyEl.classList.toggle('low', energy <= LOW_ENERGY);
      energyEl.setAttribute('aria-valuenow', Math.round(energy));
    }
    function renderItems() {
      itemBtn.disabled = !inv.length;
      itemCount.hidden = inv.length < 2;
      itemCount.textContent = inv.length;
      itemIcon.clearRect(0, 0, 64, 64);
      if (inv.length) {
        const img = ITEMS[inv[0]].img;
        const paint = () => itemIcon.drawImage(img, 0, 0, 64, 64);
        if (img.complete) paint();
        else img.addEventListener('load', paint, { once: true });
        itemBtn.setAttribute('aria-label', `${ITEMS[inv[0]].name} 쓰기 (아이템 ${inv.length}개)`);
      } else {
        itemBtn.setAttribute('aria-label', '아이템 없음');
      }
    }
    function renderEffect() {
      const left = rocketT > 0 ? rocketT / ROCKET_SEC : shieldT > 0 ? shieldT / SHIELD_SEC : 0;
      effectBar.hidden = left <= 0;
      effectFill.style.transform = `scaleX(${left})`;
      effectFill.style.background = rocketT > 0 ? C.rocket : C['blue-light'];
    }

    // ── 조작 ──
    // 단계 안에서 달린 만큼 완만하게 빨라지고, 다음 단계는 그 속도에서 이어 시작
    const speedX = () => {
      const st = STAGES[stage];
      return st.from + (st.to - st.from) * Math.min(1, stageDist / st.len);
    };
    const speedNow = () => RUN_SPEED * speedX();

    function jump() {
      if (state !== 'play' || rocketT > 0) return;
      if (dino.y > 0 || dino.vy !== 0) return; // 공중에서는 다시 못 뜀
      dino.vy = JUMP_SPEED;
      squish(-5);
      dust(4, 0.7);
      sfx.jump();
    }

    // 화면 위 한 점 → 땅 위 지점 (마우스·손가락이 가리키는 곳)
    const raycaster = new THREE.Raycaster();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const hitPoint = new THREE.Vector3();
    function aimAt(clientX, clientY) {
      if (state !== 'play') return;
      const r = canvas.getBoundingClientRect();
      const ndc = new THREE.Vector2((clientX - r.left) / r.width * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      if (!raycaster.ray.intersectPlane(groundPlane, hitPoint)) return;
      target.x = clamp(hitPoint.x, -FIELD, FIELD);
      target.d = clamp(-hitPoint.z, D_MIN, D_MAX);
    }

    // 아이템 쓰기 — 셋 다 고리·조각·번쩍임·흔들림·큰 글씨·소리로 화려하게
    function useItem() {
      if (state !== 'play' || !inv.length) return;
      const item = inv.shift();
      const c = toScreen(dino.x, dino.y + 0.8, dino.d), foot = toScreen(dino.x, 0, dino.d);
      if (item === 'shield') {
        shieldT = SHIELD_SEC;
        for (let i = 0; i < 3; i++) ring(c.x, c.y, i === 1 ? '#fff' : C['blue-light'], { r: 30, grow: 160, life: 0.6, delay: i * 0.12, width: 6 });
        burst(c.x, c.y, ['#fff', C['blue-light'], C.blue], 34, 1.2);
        flashScreen('127, 209, 255', 0.45, 0.4);
        shake(3, 0.2);
        sfx.shield();
        vibe.play('shield');
        showBanner('방패!', `${SHIELD_SEC}초 동안 무적`, C['blue-light']);
      }
      if (item === 'rocket') {
        rocketT = ROCKET_SEC;
        dino.vy = 0;
        for (let i = 0; i < 28 && parts.length < MAX_PARTS; i++) {
          parts.push({ x: foot.x + between(-34, 34), y: foot.y - between(0, 12), vx: between(-140, 140), vy: between(-90, -10),
            t: 0, life: between(0.5, 0.9), c: anyOf(['#fff', '#f1e4d0', '#d9c4a8']), s: between(6, 11), g: -30 });
        }
        ring(foot.x, foot.y, C.torch, { r: 16, grow: 170, life: 0.5, flat: 0.3, width: 7 });
        ring(foot.x, foot.y, '#fff', { r: 10, grow: 120, life: 0.45, flat: 0.3, width: 3, delay: 0.08 });
        flashScreen('255, 179, 71', 0.4, 0.35);
        shake(6, 0.35);
        sfx.rocket();
        vibe.play('rocket');
        showBanner('로켓!', `${ROCKET_SEC}초 동안 날아요 · 점수 2배`, C.rocket);
      }
      if (item === 'bolt') {
        let n = 0;
        for (let i = things.length - 1; i >= 0; i--) {
          const t = things[i];
          if (t.kind === 'item' || t.d < dino.d - 1 || t.d > 70) continue; // 지나간 것·아주 먼 것은 그대로
          const p = screenOf(t);
          strike(p.x, p.y);
          smash(i, false);
          n++;
        }
        if (!n) for (const d of [12, 24]) {
          const p = toScreen(between(-3, 3), 0, d);
          strike(p.x, p.y);
        }
        dimT = 0.5;
        flashScreen('255, 244, 190', 0.85, 0.35);
        shake(9, 0.45);
        sfx.bolt();
        vibe.play('bolt');
        showBanner('번개!', n ? `${n}개 와장창!` : '와장창!', C.bolt);
      }
      squish(-6);                                 // 아이템을 쓰면 통!
      renderItems();
      renderEffect();
    }

    // 부딪힘: 이번 프레임에 공룡 앞뒤 자리를 지나쳤고, 옆으로도 높이로도 겹치면 (빨라도 뚫고 지나가지 않게)
    function touches(t) {
      const near = Math.min(t.d, t.pd) - t.depth < dino.d + DINO_DEPTH && Math.max(t.d, t.pd) + t.depth > dino.d - DINO_DEPTH;
      return near && Math.abs(t.x - dino.x) < t.halfW + DINO_HALF && dino.y < t.y0 + t.hitH && dino.y + DINO_TALL > t.y0;
    }
    const reaches = t => Math.min(t.d, t.pd) - 0.5 < dino.d + 0.5 && Math.max(t.d, t.pd) + 0.5 > dino.d - 0.5 && Math.abs(t.x - dino.x) < 0.9;

    function hurt(i) {
      const t = things[i];
      const before = energy;
      energy = Math.max(0, energy - t.dmg);
      hurtT = HURT_SEC;
      const p = screenOf(t);
      burst(p.x, p.y, COLORS[t.kind](), 16, 1.1);
      removeThing(i);
      const c = toScreen(dino.x, dino.y + 1, dino.d);
      burst(c.x, c.y, [C.sun, '#fff', C.alarm], 12);
      popText('-' + t.dmg, c.x, c.y - 30, C.alarm);
      flashScreen('232, 51, 74', 0.35, 0.35);
      shake(6, 0.3);
      renderEnergy();
      bump(energyEl, 'hit');
      squish(12);
      if (energy > 0) sfx.hurt();
      const low = energy > 0 && energy <= LOW_ENERGY && before > LOW_ENERGY;
      if (low) sfx.low();
      if (energy > 0) vibe.play(low ? 'hurtLow' : 'hurt');   // 0이면 게임 오버 진동이 대신 울림
    }

    function gameOver() {
      state = 'over';
      overAt = last = performance.now();
      const c = toScreen(dino.x, dino.y + 1, dino.d);
      burst(c.x, c.y, [C.sun, '#fff', C.alarm], 26, 1.2);
      ring(c.x, c.y, C.alarm, { r: 10, grow: 130, life: 0.45, width: 6 });
      flashScreen('232, 51, 74', 0.45, 0.5);
      shake(9, 0.45);
      sfx.musicOff(0.3);
      sfx.hit();
      vibe.play('over');
      squish(16);
      finalEl.textContent = score;
      document.getElementById('overStage').textContent = `${STAGES[stage].name} · ${STAGES[stage].title}`;
      const isBest = score > best;
      newBestEl.hidden = !isBest;
      if (isBest) {
        best = score;
        bestEl.textContent = pad(best);
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      }
      effectBar.hidden = true;
      looping = false;
      overFx = 0;
      requestAnimationFrame(fxTick);
      setTimeout(() => {
        if (state !== 'over') return;
        overEl.hidden = false;
        againBtn.focus();
        if (isBest) sfx.best();
      }, OVER_DELAY);
    }
    // 게임 오버 뒤: 세상은 멈추고 조각·흔들림·별만 잠깐 움직인다
    function fxTick(now) {
      if (state !== 'over') return;
      const dt = Math.min(Math.max((now - last) / 1000, 0), 0.05);
      last = now;
      overFx += dt;
      clock += dt;
      stepJelly(dt);
      stepFx(dt);
      placeCamera(dt);
      render();
      if (overFx < 1.4) requestAnimationFrame(fxTick);
    }

    // 젤리 출렁임: 공중에서 빠를수록 길쭉, 꼭대기에선 동글. 그 쉼 자리로 용수철처럼 돌아온다
    function squish(v) {
      jelly.v += v * (calm ? 0.4 : 1);
    }
    function stepJelly(dt) {
      const air = (dino.y > 0 || dino.vy !== 0) && rocketT <= 0;
      const rest = air ? -Math.min(Math.abs(dino.vy) * 0.015, 0.12) : 0;
      jelly.v += (-JELLY_K * (jelly.s - rest) - JELLY_C * jelly.v) * dt;
      jelly.s = clamp(jelly.s + jelly.v * dt, -0.28, 0.34);
    }

    // ── 단계 ──
    // 오아시스(연못 가운데)까지 남은 거리. 공룡이 D_HOME에 멈췄을 때 연못 앞 가장자리가 POND_GAP 앞에 오게
    const goalD = () => STAGES[stage].len - stageDist + D_HOME + POND_GAP + oasisNow().userData.R;

    function startStage(n, retry = false) {
      stage = n;
      if (retry) {
        distance = stageStart.distance;
        bonus = stageStart.bonus;
        inv.splice(0, inv.length, ...stageStart.inv);
      } else {
        stageStart = { distance, bonus, inv: [...inv] };
      }
      Object.assign(dino, { x: 0, d: D_HOME, y: 0, vy: 0, vx: 0 });
      jelly.s = jelly.v = 0;
      Object.assign(target, { x: 0, d: D_HOME });
      for (let i = things.length - 1; i >= 0; i--) removeThing(i);
      for (const list of [parts, pops, rings, bolts, flyers]) list.length = 0;
      nextWave = FIRST_GAP + 0.8;
      nextItem = FIRST_ITEM;
      elapsed = 0;
      stageDist = 0;
      goalT = 0;
      cardShown = false;
      shieldT = rocketT = dimT = shakeT = dustT = hurtT = 0;
      flash.t = 0;
      energy = MAX_ENERGY;
      score = Math.floor(distance / M_PER_POINT) + bonus;
      scoreEl.textContent = pad(score);
      nextMilestone = (Math.floor(score / MILESTONE) + 1) * MILESTONE;
      stageChip.textContent = STAGES[n].name;
      renderEnergy();
      renderItems();
      renderEffect();
      renderTrip();
      for (const el of [overEl, clearEl, endEl]) el.hidden = true;
      paintSky();                                // 단계마다 해 높이·하늘 색이 달라짐
      showBanner(STAGES[n].name, STAGES[n].title, C.sun);
      sfx.stage();
      sfx.music(n);
      state = 'play';
      loop();
    }
    function newGame() {
      distance = 0;
      bonus = 0;
      inv.length = 0;
      startStage(0);
    }
    function loop() {
      if (looping) return;
      looping = true;
      last = performance.now();
      requestAnimationFrame(tick);
    }

    // 도착: 천천히 멈추고 → 돌아서서 폴짝폴짝 → 클리어(또는 오아시스 도착) 창
    function reachGoal() {
      state = 'goal';
      sfx.musicOff(1);
      goalT = 0;
      reachGoal.newBest = score > best;
      if (reachGoal.newBest) {
        best = score;
        bestEl.textContent = pad(best);
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      }
    }
    function confetti(n) {
      const colors = [C.blue, C['blue-light'], C.sun, C.rocket, C.energy, '#fff', C.torch];
      for (let i = 0; i < n && parts.length < MAX_PARTS; i++) {
        parts.push({ x: between(0, W), y: between(-30, -4), vx: between(-50, 50), vy: between(40, 140),
          t: 0, life: between(1.8, 2.8), c: anyOf(colors), s: between(4, 7), g: 50 });
      }
    }
    function showGoalCard() {
      cardShown = true;
      cardAt = performance.now();
      if (stage === LAST) {
        document.getElementById('endScore').textContent = score;
        document.getElementById('endBest').hidden = !reachGoal.newBest;
        endEl.hidden = false;
        endAgainBtn.focus();
      } else {
        const next = STAGES[stage + 1];
        document.getElementById('clearStage').textContent = `${STAGES[stage].name} · ${STAGES[stage].title}`;
        document.getElementById('clearScore').textContent = score;
        document.getElementById('clearNext').textContent = `다음은 ${next.name} · ${next.title}`;
        clearEl.hidden = false;
        nextBtn.focus();
      }
    }
    function goNext() {
      if (state !== 'goal' || !cardShown || performance.now() - cardAt < 500) return;
      if (stage === LAST) newGame();
      else startStage(stage + 1);
    }

    // ── 게임 루프 ──
    function tick(now) {
      if (state !== 'play' && state !== 'goal') {
        looping = false;
        return;
      }
      const dt = Math.min(Math.max((now - last) / 1000, 0), 0.05);
      last = now;
      elapsed += dt;
      clock += dt;
      const playing = state === 'play';
      if (!playing) goalT += dt;
      const coast = playing ? 1 : Math.max(0, 1 - goalT / COAST_SEC); // 도착하면 천천히 멈춤
      const ahead = speedNow() * coast * dt;     // 이번 프레임에 달린 거리 (m)
      stageDist += ahead;
      travel += ahead;
      groundTex.offset.y = pathTex.offset.y = travel / TILE % 1;

      // 키보드로도 목표점을 옮길 수 있다
      if (playing) {
        const kx = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
        const kd = (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0) - (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0);
        if (kx || kd) {
          target.x = clamp(dino.x + kx * 2.5, -FIELD, FIELD);
          target.d = clamp(dino.d + kd * 2.5, D_MIN, D_MAX);
        }
      } else {
        target.x = 0;                            // 도착하면 오아시스 앞 가운데로
        target.d = D_HOME;
      }

      // 공룡: 목표점 쪽으로 미끄러지듯 (360도 어느 방향이든)
      const vx = clamp((target.x - dino.x) * 7, -MOVE_SPEED, MOVE_SPEED);
      const vd = clamp((target.d - dino.d) * 7, -MOVE_SPEED, MOVE_SPEED);
      const sp = Math.hypot(vx, vd), k = sp > MOVE_SPEED ? MOVE_SPEED / sp : 1;
      dino.vx = vx * k;
      dino.x += dino.vx * dt;
      dino.d += vd * k * dt;

      if (rocketT > 0) {
        rocketT = Math.max(0, rocketT - dt);
        dino.y += (ROCKET_Y - dino.y) * Math.min(1, dt * 5);
        dino.vy = 0;
        const f = toScreen(dino.x, dino.y + 0.2, dino.d - 0.2);      // 로켓 꼬리 불꽃 + 연기
        for (let i = 0; i < 4 && parts.length < MAX_PARTS; i++) {
          parts.push({ x: f.x + between(-7, 7), y: f.y, vx: between(-25, 25), vy: between(180, 280),
            t: 0, life: between(0.2, 0.4), c: anyOf([C.torch, C.sun, C.rocket, '#fff']), s: between(4, 8), g: 0 });
        }
        if (parts.length < MAX_PARTS) {
          parts.push({ x: f.x + between(-8, 8), y: f.y + 30, vx: between(-40, 40), vy: between(60, 120),
            t: 0, life: between(0.5, 0.8), c: anyOf(['#fff', '#f1e4d0']), s: between(6, 10), g: -60 });
        }
      } else if (dino.y > 0 || dino.vy !== 0) {
        dino.vy -= GRAVITY * dt;
        dino.y += dino.vy * dt;
        if (dino.y <= 0 && dino.vy < 0) {        // 떨어지다가 땅에 닿으면 착지
          const hard = dino.vy < -12;           // 로켓에서 떨어지면 쿵
          dino.y = 0;
          dino.vy = 0;
          dust(hard ? 16 : 8, hard ? 1.6 : 1);
          const p = toScreen(dino.x, 0, dino.d);
          ring(p.x, p.y, 'rgba(255, 241, 214, .9)', { r: 14, grow: hard ? 90 : 45, life: 0.32, flat: 0.25, width: 3 });
          if (hard) shake(4, 0.2);
          squish(hard ? 12 : 8);
          sfx.land();
          if (hard) vibe.play('land');
        }
      } else if (!playing && goalT > COAST_SEC) {  // 다 멈추면 기뻐서 폴짝폴짝
        dino.vy = HOP;
        squish(-7);
        sfx.hop();
      } else if (coast > 0.3 && (dustT -= dt) <= 0) { // 달리는 발밑에 모래가 조금씩
        dust(1, 0.4);
        dustT = 0.12 / speedX();
      }
      if (shieldT > 0) shieldT = Math.max(0, shieldT - dt);
      if (hurtT > 0) hurtT = Math.max(0, hurtT - dt);
      stepPhase += dt * speedX() * coast;
      const stepNow = Math.floor(stepPhase / STEP_SEC);
      if (stepNow !== lastStep) {
        lastStep = stepNow;
        if (dino.y === 0 && dino.vy === 0 && rocketT <= 0 && coast > 0.3) squish(2.4);
      }
      stepJelly(dt);

      // 저 앞에서 다가오다가 카메라 뒤로 지나가면 지움
      for (const t of things) {
        t.pd = t.d;
        t.d -= ahead;
        if (t.villain) moveVillain(t, dt);
      }
      for (let i = things.length - 1; i >= 0; i--) if (things[i].d < -CAM_BACK - 3) removeThing(i);
      for (const r of decor) {
        r.userData.d -= ahead;
        if (r.userData.d < -CAM_BACK - 3) {
          r.userData.d += SPAWN_D + 10;
          r.userData.x = (Math.random() < 0.5 ? -1 : 1) * between(POST_X + 1, 34);
        }
      }
      nextWave -= dt;
      nextItem -= dt;
      // 오아시스 가까이에서는 새로 내보내지 않는다
      if (nextWave <= 0 && playing && STAGES[stage].len - stageDist > SPAWN_D + 10) spawnWave();

      // 아이템 먹기 · 부딪히기
      let hit = false;
      for (let i = things.length - 1; i >= 0 && playing; i--) {
        const t = things[i];
        if (t.kind === 'item') {
          if (!reaches(t)) continue;
          const p = screenOf(t);
          if (ITEMS[t.item].instant) {              // 치킨: 바로 에너지 회복
            energy = Math.min(MAX_ENERGY, energy + CHICKEN_HEAL);
            removeThing(i);
            burst(p.x, p.y, [C.energy, '#fff', C['chicken-light']], 18);
            ring(p.x, p.y, C.energy, { r: 8, grow: 50, life: 0.35, width: 4 });
            popText(`치킨! 에너지 +${CHICKEN_HEAL}`, p.x, p.y - 18, C.energy);
            sfx.heal();
            vibe.play('heal');
            renderEnergy();
          } else if (inv.length < MAX_ITEMS) {
            inv.push(t.item);
            removeThing(i);
            burst(p.x, p.y, ['#fff', C.sun, C['blue-light']], 16);
            ring(p.x, p.y, '#fff', { r: 8, grow: 46, life: 0.3, width: 3 });
            flyTo(ITEMS[t.item].img, p.x, p.y);
            popText(ITEMS[t.item].name + ' 획득!', p.x, p.y - 18, C.sun);
            sfx.pickup();
            vibe.play('pickup');
            squish(4);
            renderItems();
          }
        } else if (rocketT <= 0 && hurtT <= 0 && touches(t)) {
          if (shieldT > 0) {                      // 방패: 부딪힌 것을 부순다
            const c = toScreen(dino.x, dino.y + 0.8, dino.d);
            ring(c.x, c.y, C['blue-light'], { r: 30, grow: 50, life: 0.3, width: 5 });
            smash(i);
          } else {
            hurt(i);
            if (energy <= 0) hit = true;          // 에너지가 다 떨어지면 게임 오버
          }
        }
      }

      // 점수 = 달린 거리(로켓 중 2배) + 부순 점수. 도착한 뒤에는 그대로
      if (playing) distance += ahead * (rocketT > 0 ? 2 : 1);
      const pts = Math.floor(distance / M_PER_POINT) + bonus;
      if (pts !== score) {
        score = pts;
        scoreEl.textContent = pad(score);
      }
      if (score >= nextMilestone) {
        nextMilestone += MILESTONE;
        bump(scoreBox, 'pulse');
        sfx.milestone();
        vibe.play('milestone');
      }
      // 도착: 남은 거리가 멈추는 거리만큼이 되면 천천히 멈추기 시작
      if (playing && STAGES[stage].len - stageDist <= speedNow() * COAST_SEC / 2) reachGoal();
      if (!playing) {
        if (goalT - dt <= COAST_SEC && goalT > COAST_SEC) {  // 딱 멈춰서 돌아서는 순간
          confetti(stage === LAST ? 90 : 50);
          const g = toScreen(dino.x, 1, dino.d);
          ring(g.x, g.y, C.sun, { r: 20, grow: 160, life: 0.6, width: 6 });
          ring(g.x, g.y, '#fff', { r: 12, grow: 110, life: 0.5, width: 3, delay: 0.1 });
          flashScreen('255, 244, 190', 0.5, 0.4);
          burst(g.x, g.y - 10, ['#fff', C.sun, C['blue-light'], '#ff8fa3'], 24);
          squish(10);
          showBanner(stage === LAST ? '오아시스 도착!' : `${STAGES[stage].name} 클리어!`, '', stage === LAST ? C['blue-light'] : C.sun);
          if (stage === LAST) sfx.oasis();
          else sfx.clear();
          vibe.play(stage === LAST ? 'oasis' : 'clear');
        }
        if (stage === LAST && goalT > COAST_SEC && goalT < COAST_SEC + 3 && Math.random() < 0.5) confetti(2);
        if (!cardShown && goalT > COAST_SEC + CARD_AFTER) showGoalCard();
      }

      renderTrip();
      stepFx(dt);
      renderEffect();
      placeCamera(dt);
      render();
      if (hit) {
        gameOver();
        return;
      }
      requestAnimationFrame(tick);
    }

    // ── 입력 ──
    addEventListener('keydown', e => {
      const k = e.code;
      sfx.wake();
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
      keys.add(k);
      if (e.repeat) return;
      if (state === 'over') {
        if (k === 'Space' && performance.now() - overAt > OVER_GUARD) startStage(stage, true);
        return;
      }
      if (state === 'goal') {
        if (k === 'Space') goNext();
        return;
      }
      if (state !== 'play') return;
      if (k === 'Space') jump();
      else if (k === 'KeyE') useItem();
    });
    addEventListener('keyup', e => keys.delete(e.code));
    addEventListener('blur', () => keys.clear());

    // 마우스: 가리키는 곳으로 달려가고, 누르면 점프.
    // 손가락: 끌면 그쪽으로(손가락보다 조금 위를 가리켜 공룡이 손에 가리지 않게), 톡 누르면 점프
    const FINGER_LIFT = 60;
    let touch = null;
    canvas.addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse') {
        aimAt(e.clientX, e.clientY);
        return;
      }
      if (!touch || e.pointerId !== touch.id) return;
      if (!touch.drag && Math.hypot(e.clientX - touch.x, e.clientY - touch.y) > 12) touch.drag = true;
      if (touch.drag) aimAt(e.clientX, e.clientY - FINGER_LIFT);
    });
    canvas.addEventListener('pointerdown', e => {
      sfx.wake();
      if (e.pointerType === 'mouse') {
        if (e.button === 0) jump();
        return;
      }
      touch = { id: e.pointerId, x: e.clientX, y: e.clientY, drag: false, at: performance.now() };
    });
    const endTouch = e => {
      if (!touch || e.pointerId !== touch.id) return;
      if (!touch.drag && performance.now() - touch.at < 300) jump();
      touch = null;
    };
    canvas.addEventListener('pointerup', endTouch);
    canvas.addEventListener('pointercancel', () => { touch = null; });

    itemBtn.addEventListener('click', () => {
      sfx.wake();
      useItem();
    });
    function renderSound() {
      soundBtn.setAttribute('aria-pressed', sfx.on);
      soundBtn.setAttribute('aria-label', sfx.on ? '소리 끄기' : '소리 켜기');
    }
    soundBtn.addEventListener('click', () => {
      sfx.toggle();
      renderSound();
      sfx.tap();
    });
    renderSound();

    // 손가락으로 버튼이나 게임 화면을 누르면 약하게 (마우스는 진동 없음)
    stageBox.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') vibe.play('tap');
    });
    function renderVibe() {
      vibeBtn.setAttribute('aria-pressed', vibe.on);
      vibeBtn.setAttribute('aria-label', vibe.on ? '진동 끄기' : '진동 켜기');
    }
    vibeBtn.hidden = !(vibe.can && touchy);                  // 진동이 되는 휴대폰에서만 보임
    vibeBtn.addEventListener('click', () => {
      vibe.toggle();
      renderVibe();
      vibe.play('tap');
    });
    renderVibe();
    againBtn.addEventListener('click', () => {
      if (performance.now() - overAt > OVER_GUARD) startStage(stage, true);
    });
    restartBtn.addEventListener('click', () => {
      if (performance.now() - overAt > OVER_GUARD) newGame();
    });
    nextBtn.addEventListener('click', goNext);
    endAgainBtn.addEventListener('click', goNext);

    addEventListener('resize', resize);
    resize();
    newGame();
  </script>
</body>
</html>
