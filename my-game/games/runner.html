<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>공룡 달리기 · 민준이의 오락실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #0b1530;
      --night-deep: #050a1c;
      --night-glow: #1b3a6b;
      --ink: #ffffff;
      --ink-soft: #cfe0ff;
      --blue: #2f6bff;
      --blue-light: #7fd1ff;
      --blue-dark: #1d46b0;
      --wood: #c69c5d;
      --wood-ink: #2b1a0e;
      --wood-edge: #6e4a25;
      --grass: #5fb14a;
      --torch: #ffb347;
      --game: 'Jua', sans-serif;

      /* 노을 사막 */
      --dusk-top: #2a1b4d;
      --dusk-mid: #8a3a6e;
      --dusk-low: #f0745a;
      --dusk-glow: #ffc46b;
      --sun: #ffe08a;
      --sun-low: #ff8a5c;
      --mesa-far: #b0506a;
      --mesa: #6e2f52;
      --cactus: #4a2343;
      --sand-light: #f7cf8f;
      --sand: #e9a866;
      --sand-dark: #c27a45;
      --dino: #5fb14a;
      --dino-dark: #3f8f3a;
      --dino-belly: #b4e38a;
      --road: #f3c486;
      --rock: #c4703f;
      --rock-light: #e89a62;
      --rock-dark: #8f4a2a;
      --villain: #c0456b;
      --villain-light: #ef7d98;
      --villain-dark: #8e2c52;
      --bird: #5a3a5e;
      --bird-wing: #43294a;
      --bird-head: #e88a8a;
      --alarm: #e8334a;
      --bolt: #ffd23f;
      --rocket: #ff4f64;
      --energy-ok: #5fd35a;
      --chicken: #d9822b;
      --chicken-light: #f6b85a;
      --cactus-green: #3f9a5c;
      --cactus-light: #7fd08a;
      --cactus-dark: #2c6e45;
      color-scheme: dark;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--game);
      background: linear-gradient(var(--dusk-top), var(--dusk-mid) 20%, var(--dusk-low) 35%, var(--dusk-glow) 44%, var(--sand-light) 44%, var(--sand) 60%, var(--sand-dark));
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    :focus-visible { outline: 3px solid var(--blue-light); outline-offset: 3px; border-radius: 6px; }
    a, button { font: inherit; }

    .stage {
      position: relative;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 0 40px rgba(0, 0, 0, .3);
    }
    canvas { display: block; width: 100%; height: 100%; }
    #game { cursor: crosshair; touch-action: none; }
    #fx { position: absolute; inset: 0; pointer-events: none; }

    .top {
      position: absolute;
      inset: 0 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: start;
      gap: 8px;
      padding: max(14px, env(safe-area-inset-top)) 16px 0;
      color: var(--ink);
      pointer-events: none;
    }
    .top > * { pointer-events: auto; }

    .back {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 44px;
      padding: 0 13px 3px 9px;
      border: 3px solid var(--wood-ink);
      border-radius: 14px;
      font-size: 1.05rem;
      text-decoration: none;
      color: var(--wood-ink);
      background: var(--wood);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .32), inset 0 -5px 0 var(--wood-edge), 0 6px 12px rgba(42, 27, 77, .45);
      transition: transform .15s ease-out;
    }
    .back svg { width: 20px; height: 20px; }
    .back:hover { transform: translateY(-2px) rotate(-2deg); }
    .back:active { transform: translateY(2px); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* ── 에너지 게이지 (위쪽 가운데) ── */
    .energy {
      justify-self: center;
      align-self: start;
      display: flex;
      align-items: center;
      gap: 6px;
      width: min(100%, 180px);
      height: 44px;
      padding: 0 10px 0 8px;
      border-radius: 14px;
      background: rgba(42, 27, 77, .78);
      box-shadow: inset 0 0 0 2px rgba(255, 196, 107, .35);
    }
    .energy svg { flex: none; width: 22px; height: 20px; }
    .energy .gauge {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 16px;
      border: 2.5px solid var(--wood-ink);
      border-radius: 8px;
      background: rgba(5, 10, 28, .55);
      overflow: hidden;
    }
    .energy .gauge i {
      position: absolute;
      inset: 0;
      transform-origin: left;
      transition: transform .18s ease-out;
    }
    .energy .gauge .lag { background: #fff; transition: transform .5s ease-in .35s; }   /* 깎인 만큼 하얗게 남았다가 줄어듦 */
    .energy .gauge .fill { background: var(--energy-ok); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .35); }
    .energy.mid .gauge .fill { background: var(--bolt); }
    .energy.low .gauge .fill { background: var(--alarm); }
    .energy.low svg { animation: beat .6s ease-in-out infinite; }
    .energy.hit { animation: jolt .35s ease-out; }
    @keyframes beat { 50% { transform: scale(1.25); } }
    @keyframes jolt { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }

    .score {
      justify-self: end;
      min-width: 112px;
      padding: 6px 14px 8px;
      border-radius: 14px;
      text-align: right;
      background: rgba(42, 27, 77, .78);
      box-shadow: inset 0 0 0 2px rgba(255, 196, 107, .35);
      font-variant-numeric: tabular-nums;
    }
    .score .label { display: block; font-size: .85rem; color: var(--dusk-glow); line-height: 1.2; }
    .score .now { display: block; font-size: 1.9rem; line-height: 1.05; letter-spacing: 1px; }
    .score .best { display: block; margin-top: 2px; font-size: .85rem; color: var(--ink-soft); }
    .score .best b { font-weight: 400; color: var(--torch); }

    /* ── 아이템 버튼 (오른쪽 아래) ── */
    .item {
      position: absolute;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      width: 68px;
      height: 68px;
      padding: 0;
      border: 3px solid var(--wood-ink);
      border-radius: 18px;
      background: var(--wood);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .32), inset 0 -5px 0 var(--wood-edge), 0 6px 12px rgba(42, 27, 77, .4);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .12s ease-out;
    }
    .item:active { transform: translateY(2px); }
    .item canvas { display: block; width: 42px; height: 42px; margin: 0 auto 2px; }
    .item:disabled { cursor: default; background: rgba(255, 241, 214, .82); border-style: dashed; box-shadow: none; }
    .item:disabled canvas { visibility: hidden; }
    .item .empty {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      font-size: .8rem;
      line-height: 1.15;
      color: var(--wood-ink);
    }
    .item:disabled .empty { display: grid; }
    .item .count {
      position: absolute;
      top: -9px;
      right: -9px;
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      border: 2.5px solid var(--wood-ink);
      border-radius: 12px;
      font-size: .9rem;
      line-height: 19px;
      color: #fff;
      background: var(--blue);
    }
    .item .count[hidden] { display: none; }
    .item .key {
      position: absolute;
      left: -8px;
      bottom: -8px;
      width: 24px;
      height: 24px;
      border: 2.5px solid var(--wood-ink);
      border-radius: 7px;
      font-size: .85rem;
      line-height: 19px;
      color: var(--wood-ink);
      background: var(--sand-light);
    }
    .item .bar {
      position: absolute;
      left: 4px;
      right: 18px;
      top: -14px;
      height: 6px;
      border-radius: 3px;
      background: rgba(43, 26, 14, .35);
      overflow: hidden;
    }
    .item .bar[hidden] { display: none; }
    .item .bar i { display: block; height: 100%; width: 100%; background: var(--blue-light); transform-origin: left; }
    @media (pointer: coarse) { .item .key { display: none; } }

    /* ── 소리 버튼 (왼쪽 아래) ── */
    .sound {
      position: absolute;
      left: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      padding: 0;
      border: 3px solid var(--wood-ink);
      border-radius: 15px;
      background: var(--wood);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .32), inset 0 -5px 0 var(--wood-edge), 0 6px 12px rgba(42, 27, 77, .4);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .12s ease-out;
    }
    .sound:active { transform: translateY(2px); }
    .sound svg { width: 26px; height: 26px; margin-top: -2px; }
    .sound .off { display: none; }
    .sound[aria-pressed="false"] .on { display: none; }
    .sound[aria-pressed="false"] .off { display: block; }
    .sound.vibe { left: 76px; }
    .sound[hidden] { display: none; }

    /* ── 가운데 큰 알림 (아이템 이름, 빨라진다!) ── */
    .banner {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 30%;
      text-align: center;
      font-size: 3.2rem;
      line-height: 1;
      color: var(--sun);
      pointer-events: none;
      opacity: 0;
      text-shadow: 3px 0 0 var(--wood-ink), -3px 0 0 var(--wood-ink), 0 3px 0 var(--wood-ink), 0 -3px 0 var(--wood-ink),
        3px 3px 0 var(--wood-ink), -3px 3px 0 var(--wood-ink), 3px -3px 0 var(--wood-ink), -3px -3px 0 var(--wood-ink), 0 7px 0 var(--wood-ink);
    }
    .banner small {
      display: block;
      margin-top: 10px;
      font-size: 1.1rem;
      color: var(--ink);
      text-shadow: 2px 0 0 var(--wood-ink), -2px 0 0 var(--wood-ink), 0 2px 0 var(--wood-ink), 0 -2px 0 var(--wood-ink);
    }
    .banner.show { animation: banner 1.2s ease-out both; }
    @keyframes banner {
      0% { opacity: 0; transform: scale(.3) rotate(-10deg); }
      16% { opacity: 1; transform: scale(1.2) rotate(4deg); }
      28% { transform: scale(1) rotate(0); }
      78% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.08) translateY(-18px); }
    }
    .item.bump { animation: bump .35s ease-out; }
    .score.pulse { animation: bump .45s ease-out; }
    @keyframes bump { 40% { transform: scale(1.18); } }

    /* ── 처음 안내 ── */
    .hint {
      position: absolute;
      left: 50%;
      top: calc(max(14px, env(safe-area-inset-top)) + 134px);
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 8px 14px 9px;
      border-radius: 14px;
      text-align: center;
      font-size: .95rem;
      line-height: 1.35;
      color: var(--ink);
      background: rgba(42, 27, 77, .8);
      pointer-events: none;
      text-wrap: balance;
      transition: opacity .5s ease-out;
    }
    .hint.gone { opacity: 0; }

    /* ── 단계 진행 막대 (위쪽 줄 아래) ── */
    .trip {
      position: absolute;
      left: 16px;
      right: 16px;
      top: calc(max(14px, env(safe-area-inset-top)) + 92px);
      display: flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 10px 0 5px;
      border-radius: 16px;
      background: rgba(42, 27, 77, .62);
      pointer-events: none;
    }
    .trip .chip {
      flex: none;
      padding: 2px 10px 4px;
      border: 2px solid var(--wood-ink);
      border-radius: 11px;
      font-size: .92rem;
      line-height: 1.1;
      color: var(--wood-ink);
      background: var(--sun);
    }
    .trip .track {
      position: relative;
      flex: 1;
      height: 10px;
      border: 2px solid var(--wood-ink);
      border-radius: 6px;
      background: rgba(5, 10, 28, .5);
    }
    .trip .track i {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      background: var(--sand-light);
      transform-origin: left;
      transform: scaleX(0);
    }
    .trip .track b {
      position: absolute;
      top: 50%;
      left: 0;
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
      border: 2.5px solid var(--wood-ink);
      border-radius: 5px;
      background: var(--dino);
    }
    .trip svg { flex: none; width: 22px; height: 22px; }

    /* ── 게임 오버 ── */
    .over {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(42, 27, 77, .45);
    }
    .over[hidden] { display: none; }
    .over .card {
      width: min(100%, 300px);
      padding: 24px 20px 22px;
      border-radius: 22px;
      text-align: center;
      color: var(--ink);
      background: var(--dusk-top);
      box-shadow: inset 0 0 0 3px var(--wood-ink), inset 0 0 0 6px var(--mesa-far), 0 18px 36px rgba(0, 0, 0, .4);
      animation: pop .4s cubic-bezier(.2, 1.4, .4, 1) both;
    }
    @keyframes pop { from { transform: scale(.85) translateY(12px); } }
    .over h2 { font-size: 2.3rem; font-weight: 400; line-height: 1.1; color: var(--sun); text-shadow: 0 3px 0 var(--wood-ink); }
    .over .record { margin-top: 10px; font-size: 1.3rem; color: var(--ink-soft); }
    .over .record b { font-weight: 400; font-size: 1.7rem; color: var(--ink); font-variant-numeric: tabular-nums; }
    .over .newbest { margin-top: 4px; font-size: 1.05rem; color: var(--torch); }
    .over .newbest[hidden] { display: none; }
    .again {
      margin-top: 18px;
      padding: 12px 30px 15px;
      border: 3px solid var(--wood-ink);
      border-radius: 16px;
      font-size: 1.35rem;
      color: #fff;
      background: var(--blue);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .35), inset 0 -5px 0 var(--blue-dark), 0 8px 18px rgba(0, 0, 0, .3);
      cursor: pointer;
      transition: transform .12s ease-out;
    }
    .again:hover { transform: translateY(-2px); }
    .again:active { transform: translateY(2px); }
    .over .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 18px; }
    .over .actions .again { margin-top: 0; }
    .sub {
      padding: 9px 22px 11px;
      border: 3px solid var(--wood-ink);
      border-radius: 14px;
      font-size: 1.05rem;
      text-decoration: none;
      color: var(--wood-ink);
      background: var(--wood);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .32), inset 0 -4px 0 var(--wood-edge);
      cursor: pointer;
    }
    .sub:active { transform: translateY(2px); }
    /* 클리어·도착 창: 뒤쪽 장면(결승 아치, 오아시스)이 보이게 배경을 덮지 않고 위쪽에 */
    .over.goal { place-items: start center; padding-top: 25svh; background: none; }
    .over .kicker { font-size: 1.05rem; color: var(--dusk-glow); }
    .over .next { margin-top: 6px; font-size: 1.05rem; color: var(--ink-soft); }
    .over .note { margin-top: 4px; font-size: 1rem; color: var(--energy-ok); }
    .over .palm { display: block; width: 44px; height: 44px; margin: -4px auto 4px; }

    @media (prefers-reduced-motion: reduce) {
      .back, .again, .item, .hint, .sound { transition: none; }
      .item.bump, .score.pulse, .energy.hit, .energy.low svg { animation: none; }
      .banner.show { animation: fade 1.2s linear both; }
      @keyframes fade { 0%, 100% { opacity: 0; } 10%, 80% { opacity: 1; } }
      .over .card { animation: none; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sound" viewBox="0 0 24 24">
        <path d="M3.5 9h4l5-4.2v14.4l-5-4.2h-4z" fill="#2b1a0e"/>
        <path d="M16 8.6a4.8 4.8 0 0 1 0 6.8M18.6 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="#2b1a0e" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-vibe" viewBox="0 0 24 24">
        <rect x="8" y="3.5" width="8" height="17" rx="2" fill="none" stroke="#2b1a0e" stroke-width="2.3"/>
        <path d="M11 17.5h2M4.5 8.5v7M1.8 10.5v3M19.5 8.5v7M22.2 10.5v3" fill="none" stroke="#2b1a0e" stroke-width="2.3" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-vibe-off" viewBox="0 0 24 24">
        <rect x="8" y="3.5" width="8" height="17" rx="2" fill="none" stroke="#2b1a0e" stroke-width="2.3"/>
        <path d="M3 3l18 18" fill="none" stroke="#2b1a0e" stroke-width="2.3" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-mute" viewBox="0 0 24 24">
        <path d="M3.5 9h4l5-4.2v14.4l-5-4.2h-4z" fill="#2b1a0e"/>
        <path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="#2b1a0e" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-heart" viewBox="0 0 9 8">
        <g shape-rendering="crispEdges">
          <path fill="#2b1a0e" d="M1 0h3v1h1V0h3v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z"/>
          <path fill="#e8334a" d="M1 1h3v1h1V1h3v3H7v1H6v1H5v1H4V6H3V5H2V4H1z"/>
          <path fill="#fff" d="M2 2h1v1H2z"/>
        </g>
      </symbol>
      <symbol id="i-palm" viewBox="0 0 12 12">
        <g shape-rendering="crispEdges">
          <path fill="#2f6bff" d="M1 10h10v2H1z"/>
          <path fill="#a0703f" d="M5 4h2v6H5z"/>
          <path fill="#5fb14a" d="M3 1h6v1H3zM1 2h4v1H1zM7 2h4v1H7zM0 3h2v1H0zM10 3h2v1h-2zM4 3h4v1H4z"/>
        </g>
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M13.5 5 6.5 12l7 7M7.5 12H19" fill="none" stroke="#2b1a0e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="stage" id="stage">
    <canvas id="game" aria-label="공룡 달리기 3D 게임 화면. 노을 지는 사막을 달리는 공룡. 마우스나 손가락으로 가리키는 쪽으로 움직이고, 눌러서 점프해 장애물과 빌런을 피하고, 아이템을 먹어서 써요."></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="top">
      <a class="back" href="../arcade.html"><svg aria-hidden="true"><use href="#i-back"/></svg>오락실</a>
      <h1 class="sr-only">공룡 달리기</h1>
      <div class="energy" id="energy" role="meter" aria-label="에너지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <svg aria-hidden="true"><use href="#i-heart"/></svg>
        <span class="gauge"><i class="lag" id="energyLag"></i><i class="fill" id="energyFill"></i></span>
      </div>
      <div class="score" aria-label="점수">
        <span class="label">점수</span>
        <span class="now" id="score">00000</span>
        <span class="best">최고 <b id="best">00000</b></span>
      </div>
    </div>

    <div class="trip" aria-hidden="true">
      <span class="chip" id="stageChip">1단계</span>
      <span class="track"><i id="tripFill"></i><b id="tripDot"></b></span>
      <svg><use href="#i-palm"/></svg>
    </div>

    <p class="hint" id="hint"></p>
    <p class="banner" id="banner" aria-live="polite"></p>

    <button class="sound" id="soundBtn" type="button" aria-pressed="true" aria-label="소리 끄기">
      <svg class="on" aria-hidden="true"><use href="#i-sound"/></svg>
      <svg class="off" aria-hidden="true"><use href="#i-mute"/></svg>
    </button>
    <button class="sound vibe" id="vibeBtn" type="button" aria-pressed="true" aria-label="진동 끄기" hidden>
      <svg class="on" aria-hidden="true"><use href="#i-vibe"/></svg>
      <svg class="off" aria-hidden="true"><use href="#i-vibe-off"/></svg>
    </button>

    const STAGES = [
      { name: '1단계', title: '모래 언덕', len: 470, from: 1.0, to: 1.35, sun: 72, sky: [0.3, 0.68], stars: 0.35,

    const POST_GAP = 8;         // 길가 나무 말뚝 간격 (m)
    const POST_X = FIELD + 1.4;
    const MAX_PARTS = 220;
    const OVER_DELAY = 650;     // 부딪힌 뒤 효과를 보여 주고 이만큼(ms) 뒤에 결과 창
    const OVER_GUARD = 1000;    // 게임 오버 뒤 이 시간(ms)은 스페이스 무시
    const SOUND_KEY = 'mj-runner-sound';
    const VIBE_KEY = 'mj-runner-vibe';

    // ── 진동 (휴대폰 바이브레이터) ──
    // navigator.vibrate: 안드로이드 크롬 등에서만 울린다(아이폰 사파리는 지원 안 함). 화면을 한 번 누른 뒤부터.
    // 세기는 못 정하니 '강한' 진동은 길게. [울림, 쉼, 울림 …(ms), 우선순위] — 센 진동이 울리는 동안 약한 건 끼어들지 않는다
    const HAPTIC = {
      tap: [[12], 0],                                   // 버튼·화면 누름
      land: [[40], 1],                                  // 로켓에서 쿵 착지
      pickup: [[20, 40, 20], 1],                        // 아이템 먹기
      heal: [[20, 30, 40], 1],                          // 치킨
      smash: [[25], 1],                                 // 방패로 부수기
      alarm: [[15, 60, 15], 1],                         // 빌런 경고
      milestone: [[15, 40, 15], 1],                     // 500점마다
      shield: [[30, 40, 30, 40, 60], 2],
      bolt: [[60, 40, 160], 2],
      rocket: [[20, 30, 30, 30, 220], 2],
      clear: [[40, 60, 40, 60, 120], 2],                // 단계 클리어
      oasis: [[50, 60, 50, 60, 50, 60, 300], 2],        // 오아시스 도착
      hurt: [[220, 90, 220, 90, 220], 3],               // 부딪혀서 에너지 감소: 길고 강하게 3번
      hurtLow: [[220, 90, 220, 90, 220, 160, 90, 70, 90], 3], // + 에너지가 빨간 구간으로 떨어짐 경고
      over: [[350, 100, 350, 100, 600], 4],             // 게임 오버
    };
    const vibe = (() => {
      const can = typeof navigator.vibrate === 'function';
      let on = true, busyUntil = 0, busyPrio = -1;
      try { on = localStorage.getItem(VIBE_KEY) !== 'off'; } catch (e) {}
      return {
        can,
        get on() { return on; },
        toggle() {
          on = !on;
          try { localStorage.setItem(VIBE_KEY, on ? 'on' : 'off'); } catch (e) {}
          if (!on && can) navigator.vibrate(0);
          return on;
        },
        play(name) {
          if (!can || !on) return;
          if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
          const [pattern, prio] = HAPTIC[name];
          const now = performance.now();
          if (now < busyUntil && prio < busyPrio) return;
          navigator.vibrate(pattern);
          busyUntil = now + pattern.reduce((a, b) => a + b, 0);
          busyPrio = prio;
        },
      };
    })();
    const SFX_VOLUME = 3.5;     // 효과음 전체 음량 배수 (사용자 요청으로 키움)

    const target = { x: 0, d: D_HOME };                    // 마우스·손가락이 가리키는 땅 위 지점

    let nextWave = FIRST_GAP;
    let nextItem = FIRST_ITEM;
    let state = 'play';           // play | goal | over
    let elapsed = 0;
    let distance = 0;             // 점수용 거리 (로켓 중엔 2배)
    let bonus = 0;
    let travel = 0;               // 땅 무늬·말뚝용 누적 거리
    let clock = 0;

    let shieldT = 0;

    let last = performance.now();
    let camX = 0;
    const jelly = { s: 0, v: 0 };

    const keys = new Set();
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; // 움직임 줄이기면 흔들림·속도선 없음

    const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const C = {};
    for (const k of ['dusk-top', 'dusk-mid', 'dusk-low', 'dusk-glow', 'sun', 'sun-low', 'mesa-far', 'mesa', 'cactus',
      'sand-light', 'sand', 'sand-dark', 'road', 'wood', 'wood-ink', 'wood-edge', 'dino', 'dino-dark', 'dino-belly',

    function seeded(seed) {
      return () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const anyOf = list => list[Math.floor(Math.random() * list.length)];
    const between = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // ═════════ SVG 캐릭터 ═════════

    const svgDoc = (inner, defs = '', box = 200) =>

          `<circle cx="84" cy="63" r="7" fill="${INK}" stroke="none"/><circle cx="116" cy="63" r="7" fill="${INK}" stroke="none"/>` +

      const toes = x => [-8, 0, 8].map(dx => `<ellipse cx="${x + dx}" cy="191" rx="3.2" ry="2.6" fill="#fff" stroke-width="2"/>`).join('');
      return svgDoc(
        `<path d="M138 150 C164 148 184 160 193 178 C172 174 156 170 140 170 Z" fill="url(#g)"/>` +

        `<ellipse cx="100" cy="128" rx="50" ry="44" fill="url(#g)"/>` +
        `<ellipse cx="100" cy="134" rx="31" ry="30" fill="#f6eebf" stroke-width="3.5"/>` +

        armsSvg +
        `<circle cx="100" cy="64" r="44" fill="url(#g)"/>` +
        `<ellipse cx="64" cy="80" rx="9" ry="5" fill="#ff8fa3" stroke="none" opacity=".85"/><ellipse cx="136" cy="80" rx="9" ry="5" fill="#ff8fa3" stroke="none" opacity=".85"/>` +
        `<circle cx="95" cy="75" r="1.7" fill="${INK}" stroke="none"/><circle cx="105" cy="75" r="1.7" fill="${INK}" stroke="none"/>` +

    // 빌런 1: 전갈 (정면, 집게를 딸깍딸깍)
    function scorpionSvg(open) {
      const defs = `<radialGradient id="v" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="${C['villain-light']}"/><stop offset="1" stop-color="${C['villain-dark']}"/></radialGradient>`;

        `<path d="M70 150 Q100 160 130 150" fill="none" stroke-width="3" opacity=".5"/>` +
        `<ellipse cx="88" cy="140" rx="8" ry="9" fill="#fff" stroke-width="3"/><ellipse cx="112" cy="140" rx="8" ry="9" fill="#fff" stroke-width="3"/>` +
        `<circle cx="89" cy="142" r="4.5" fill="${INK}" stroke="none"/><circle cx="111" cy="142" r="4.5" fill="${INK}" stroke="none"/>` +
        `<path d="M76 127 L95 134 M124 127 L105 134" fill="none" stroke-width="5"/>` +

    // 빌런 2: 독수리 (정면으로 날아옴, 날개 위아래)
    function vultureSvg(up) {
      const defs = `<radialGradient id="b" cx=".45" cy=".3" r=".8"><stop offset="0" stop-color="#7a5480"/><stop offset="1" stop-color="${C['bird-wing']}"/></radialGradient>`;

        `<circle cx="100" cy="60" r="20" fill="${C['bird-head']}"/>` +
        `<ellipse cx="92" cy="58" rx="5" ry="6" fill="#fff" stroke-width="3"/><ellipse cx="108" cy="58" rx="5" ry="6" fill="#fff" stroke-width="3"/>` +
        `<circle cx="92" cy="59" r="3" fill="${C.alarm}" stroke="none"/><circle cx="108" cy="59" r="3" fill="${C.alarm}" stroke="none"/>` +
        `<path d="M83 47 L96 53 M117 47 L104 53" fill="none" stroke-width="5"/>` +
        `<path d="M94 66 Q100 63 106 66 Q105 80 98 85 Q99 74 94 66 Z" fill="${C.torch}" stroke-width="3.5"/>` + shine(90, 50, 7, 4),
        defs);

    // 아이템 (viewBox 100)
    const ITEM_SVG = {
      shield: svgDoc(
        `<path d="M50 8 L86 20 Q86 64 50 92 Q14 64 14 20 Z" fill="url(#s)"/>` +
        `<path d="M50 18 L76 27 Q75 60 50 81 Q25 60 24 27 Z" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>` +
        `<path d="M50 32 L55 44 L68 45 L58 53 L62 66 L50 58 L38 66 L42 53 L32 45 L45 44 Z" fill="#fff" stroke-width="2.5"/>`,
        `<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C['blue-light']}"/><stop offset="1" stop-color="${C.blue}"/></linearGradient>`, 100),
      bolt: svgDoc(
        `<path d="M60 6 L20 56 L46 56 L36 94 L82 40 L55 40 L68 6 Z" fill="${C.bolt}"/>` +

      rocket: svgDoc(
        `<path d="M42 72 Q50 98 58 72 Z" fill="${C.torch}"/>` +
        `<path d="M36 56 L20 80 L37 73 Z M64 56 L80 80 L63 73 Z" fill="${C.rocket}"/>` +
        `<path d="M50 6 C68 20 70 46 64 72 L36 72 C30 46 32 20 50 6 Z" fill="#fff"/>` +
        `<path d="M50 6 C60 14 64 24 65 32 L35 32 C36 24 40 14 50 6 Z" fill="${C.rocket}"/>` +
        `<circle cx="50" cy="47" r="9" fill="${C['blue-light']}" stroke-width="3"/>`, '', 100),

        `<circle cx="15" cy="80" r="7" fill="#fff3e0" stroke-width="3"/><circle cx="22" cy="88" r="7" fill="#fff3e0" stroke-width="3"/>` +
        `<path d="M60 10 C84 8 94 34 82 52 C74 64 56 66 46 58 C36 48 40 16 60 10 Z" fill="url(#c)"/>` +
        shine(62, 26, 10, 6, -35, 0.5),
        `<radialGradient id="c" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="${C['chicken-light']}"/><stop offset="1" stop-color="${C.chicken}"/></radialGradient>`, 100),
    };

    // SVG → 256px 캔버스 → 3D 텍스처 (flip이면 좌우를 뒤집어 그림)
    function svgImage(svg) {
      const img = new Image(256, 256);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      return img;
    }
    function svgTexture(svg, flip = false) {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const tex = new THREE.CanvasTexture(c);
      const img = svgImage(svg);
      img.onload = () => {
        const g = c.getContext('2d');
        if (flip) {
          g.translate(256, 0);
          g.scale(-1, 1);
        }
        g.drawImage(img, 0, 0, 256, 256);
        tex.needsUpdate = true;
      };
      return tex;
    }
    const TEX = {
      back: [svgTexture(dinoBack('a')), svgTexture(dinoBack('b'))],
      backAir: svgTexture(dinoBack('tuck')),
      left: [svgTexture(dinoQuarter('a')), svgTexture(dinoQuarter('b'))],
      right: [svgTexture(dinoQuarter('a'), true), svgTexture(dinoQuarter('b'), true)],
      leftAir: svgTexture(dinoQuarter('tuck')),
      rightAir: svgTexture(dinoQuarter('tuck'), true),
      cheerUp: svgTexture(dinoFront('up', 'happy')),
      cheerDown: svgTexture(dinoFront('down', 'happy')),
      dizzy: svgTexture(dinoFront('down', 'dizzy')),
      scorpion: [svgTexture(scorpionSvg(true)), svgTexture(scorpionSvg(false))],
      vulture: [svgTexture(vultureSvg(true)), svgTexture(vultureSvg(false))],
    };
    const ITEMS = {
      shield: { name: '방패' },
      bolt: { name: '번개' },
      rocket: { name: '로켓' },
      chicken: { name: '치킨', instant: true },
    };
    for (const k in ITEMS) {
      ITEMS[k].img = svgImage(ITEM_SVG[k]);             // 아이템 버튼·날아가는 그림용
      ITEMS[k].tex = svgTexture(ITEM_SVG[k]);           // 3D 세상용
    }
    const USE_ITEMS = ['shield', 'bolt', 'rocket'];

    // ═════════ 3D 세상 ═════════
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 420);
    scene.fog = new THREE.Fog(new THREE.Color(C['dusk-glow']), 30, 150);  // 멀리 있는 것은 지평선 빛 속으로
    scene.add(new THREE.HemisphereLight(0xffe2b8, 0x8a4a3c, 0.55));
    const sunLight = new THREE.DirectionalLight(0xffe6c0, 0.5);
    sunLight.position.set(-6, 10, 10);
    scene.add(sunLight);

    const col = c => new THREE.Color(c);
    const lambert = (color, extra = {}) => new THREE.MeshLambertMaterial({ color: col(color), flatShading: true, ...extra });
    const outlineMat = new THREE.MeshBasicMaterial({ color: col(INK), side: THREE.BackSide });
    // 만화 테두리: 모양을 바깥쪽으로 조금 부풀린 뒤 뒷면만 잉크색으로 칠한다
    function toon(geom, color, t = 0.035) {
      const mesh = new THREE.Mesh(geom, typeof color === 'string' ? lambert(color) : color);
      const g = geom.clone();
      const pos = g.attributes.position, nor = g.attributes.normal;
      for (let i = 0; i < pos.count; i++) {
        pos.setXYZ(i, pos.getX(i) + nor.getX(i) * t, pos.getY(i) + nor.getY(i) * t, pos.getZ(i) + nor.getZ(i) * t);
      }
      mesh.add(new THREE.Mesh(g, outlineMat));
      return mesh;
    }
    const at = (obj, x, y, z) => {
      obj.position.set(x, y, z);
      return obj;
    };

    // 둥근 그림자 (아래가 진하고 가장자리가 흐린 원)
    const shadowTex = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const r = g.createRadialGradient(32, 32, 4, 32, 32, 32);
      r.addColorStop(0, 'rgba(43, 26, 14, .45)');
      r.addColorStop(1, 'rgba(43, 26, 14, 0)');
      g.fillStyle = r;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    })();
    const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
    const shadowGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
    function blob(w, d = w) {
      const m = new THREE.Mesh(shadowGeo, shadowMat);
      m.scale.set(w, 1, d);
      m.position.y = 0.02;
      return m;
    }

    // 하늘: 노을 그라데이션·별·해·메사를 그린 캔버스를 배경으로 (지평선 높이는 카메라에서 계산)
    const skyCanvas = document.createElement('canvas');
    const skyTex = new THREE.CanvasTexture(skyCanvas);
    scene.background = skyTex;

    // 땅: 모래 무늬 텍스처를 깔고 달린 만큼 밀어서 움직이는 느낌
    function sandTexture(path) {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = path ? C.road : C.sand;
      g.fillRect(0, 0, 256, 256);
      const rnd = seeded(path ? 5 : 9);
      for (let i = 0; i < 420; i++) {
        g.fillStyle = rnd() > 0.5 ? C['sand-light'] : C['sand-dark'];
        g.globalAlpha = 0.25 + rnd() * 0.35;
        g.fillRect(rnd() * 256, rnd() * 256, 2 + rnd() * 3, 2 + rnd() * 2);
      }
      g.globalAlpha = path ? 0.18 : 0.28;            // 바람 물결
      g.strokeStyle = C['sand-dark'];
      g.lineWidth = 3;
      for (let i = 0; i < 6; i++) {
        const y = 20 + i * 42;
        g.beginPath();
        g.moveTo(0, y);
        g.bezierCurveTo(80, y - 14, 170, y + 14, 256, y);
        g.stroke();
      }
      g.globalAlpha = 1;
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 4;
      return tex;
    }
    const TILE = 10;                                  // 땅 무늬 한 칸 = 10m
    const groundTex = sandTexture(false);
    groundTex.repeat.set(26, 44);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(260, 440), new THREE.MeshLambertMaterial({ map: groundTex }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.z = -210;
    scene.add(ground);
    const pathTex = sandTexture(true);
    pathTex.repeat.set(1.5, 44);
    const pathMesh = new THREE.Mesh(new THREE.PlaneGeometry(FIELD * 2 + 1.6, 440), new THREE.MeshLambertMaterial({ map: pathTex }));
    pathMesh.rotation.x = -Math.PI / 2;
    pathMesh.position.set(0, 0.01, -210);
    scene.add(pathMesh);

    // 길가 나무 말뚝 (빨간 띠) — 달린 만큼 다가오고 지나가면 다시 저 앞에
    const postGeo = new THREE.BoxGeometry(0.26, 1.2, 0.26).translate(0, 0.6, 0);
    const bandGeo = new THREE.BoxGeometry(0.28, 0.2, 0.28).translate(0, 0.95, 0);
    const posts = [];
    for (let i = 0; i < Math.ceil((SPAWN_D + 12) / POST_GAP); i++) {
      for (const side of [-1, 1]) {
        const p = toon(postGeo, C.wood, 0.03);
        p.add(new THREE.Mesh(bandGeo, lambert(C.rocket)));
        p.add(blob(0.7));
        p.userData = { i, side };
        scene.add(p);
        posts.push(p);
      }
    }
    // 길 옆 돌멩이
    const rockGeo = new THREE.DodecahedronGeometry(1, 0);
    const decor = [];
    for (let i = 0; i < 40; i++) {
      const r = toon(rockGeo, i % 3 ? C['sand-dark'] : C.rock, 0.06);
      const s = between(0.25, 0.7);
      r.scale.set(s, s * 0.6, s);
      r.rotation.y = Math.random() * 6;
      r.userData = { x: (Math.random() < 0.5 ? -1 : 1) * between(POST_X + 1, 34), d: between(-6, SPAWN_D) };
      scene.add(r);
      decor.push(r);
    }

    // ── 장애물 모형 ──
    function makeCactus(h) {
      const g = new THREE.Group();
      const green = lambert(C['cactus-green']);
      g.add(at(toon(new THREE.CylinderGeometry(0.2, 0.23, h, 8), green), 0, h / 2, 0));
      g.add(at(toon(new THREE.SphereGeometry(0.2, 8, 5, 0, Math.PI * 2, 0, Math.PI / 2), green), 0, h, 0));
      for (const [side, y] of [[-1, h * 0.42], [1, h * 0.58]]) {
        const ah = h * 0.32;
        const arm = toon(new THREE.CylinderGeometry(0.11, 0.11, 0.32, 7), green);
        arm.rotation.z = Math.PI / 2;
        g.add(at(arm, side * 0.32, y, 0));
        g.add(at(toon(new THREE.CylinderGeometry(0.11, 0.11, ah, 7), green), side * 0.46, y + ah / 2, 0));
        g.add(at(toon(new THREE.SphereGeometry(0.11, 7, 4, 0, Math.PI * 2, 0, Math.PI / 2), green), side * 0.46, y + ah, 0));
      }
      g.add(blob(1.1, 0.8));
      return g;
    }
    const cactusModels = CACTUS_SIZES.map(({ h }) => makeCactus(h));

    const pillarModel = (() => {
      const g = new THREE.Group();
      const rock = lambert(C.rock), light = lambert(C['rock-light']), dark = lambert(C['rock-dark']);
      g.add(at(toon(new THREE.CylinderGeometry(0.95, 1.05, 0.6, 9), rock), 0, 0.3, 0));
      g.add(at(toon(new THREE.CylinderGeometry(0.62, 0.8, 1.9, 9), light), 0, 1.55, 0));
      for (const y of [1.0, 1.6, 2.2]) g.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.69 - (y - 1) * 0.1, 0.71 - (y - 1) * 0.1, 0.1, 9), dark), 0, y, 0));
      g.add(at(toon(new THREE.CylinderGeometry(0.45, 0.6, 0.4, 9), rock), 0, 2.7, 0));
      g.add(at(toon(new THREE.CylinderGeometry(1.0, 0.85, 0.5, 9), rock), 0, 3.1, 0));
      g.add(at(toon(new THREE.SphereGeometry(0.9, 9, 4, 0, Math.PI * 2, 0, Math.PI / 2), light), 0, 3.35, 0));
      g.add(blob(2.6));
      return g;
    })();

    const fenceModel = (() => {
      const g = new THREE.Group();
      for (const x of [-2, -0.67, 0.67, 2]) g.add(at(toon(new THREE.BoxGeometry(0.2, 0.8, 0.2), C['wood-edge']), x, 0.4, 0));
      for (const y of [0.58, 0.3]) g.add(at(toon(new THREE.BoxGeometry(4.3, 0.14, 0.1), C.wood), 0, y, 0.06));
      g.add(blob(4.8, 0.9));
      return g;
    })();

    // 그림판 캐릭터 (빌런·아이템): 그림 + 그림자
    function spriteThing(tex, size, lift = 0) {
      const g = new THREE.Group();
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, fog: true }));
      sp.center.set(0.5, 0.03);
      sp.scale.set(size, size, 1);
      sp.position.y = lift;
      g.add(sp);
      g.add(blob(size * 0.7, size * 0.45));
      g.userData.sprite = sp;
      g.userData.size = size;
      g.userData.lift = lift;
      return g;
    }

    // ── 공룡 ──
    const dinoSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.back[0], transparent: true }));
    dinoSprite.center.set(0.5, 0.02);
    dinoSprite.scale.set(DINO_SIZE, DINO_SIZE, 1);
    scene.add(dinoSprite);
    const dinoShadow = blob(1.2, 0.8);
    scene.add(dinoShadow);
    const rocketPack = new THREE.Sprite(new THREE.SpriteMaterial({ map: ITEMS.rocket.tex, transparent: true }));
    rocketPack.center.set(0.5, 0.2);
    rocketPack.scale.set(0.8, 0.8, 1);
    rocketPack.visible = false;
    scene.add(rocketPack);
    const bubbleMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14),
      new THREE.MeshBasicMaterial({ color: col(C['blue-light']), transparent: true, opacity: 0.22, depthWrite: false }));
    bubbleMesh.visible = false;
    scene.add(bubbleMesh);
    // 마우스가 가리키는 땅 위 지점 표시
    const marker = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.42, 24).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false }));
    marker.position.y = 0.03;
    scene.add(marker);

    // ── 오아시스 (단계 끝마다, 마지막은 크고 꽃이 핀 오아시스) ──
    function makePalm(h, lean) {
      const g = new THREE.Group();
      const n = 6, seg = h / n;
      let x = 0, y = 0;
      for (let i = 0; i < n; i++) {
        const t = (i + 0.5) / n;
        const dx = lean * 2 * t / n;
        const m = toon(new THREE.CylinderGeometry(0.15 - i * 0.008, 0.19 - i * 0.008, seg * 1.04, 7), i % 2 ? '#8a5a30' : '#a0703f', 0.03);
        m.position.set(x + dx / 2, y + seg / 2, 0);
        m.rotation.z = -Math.atan2(dx, seg);
        g.add(m);
        x += dx;
        y += seg;
      }
      const leafMat = lambert(C.grass, { side: THREE.DoubleSide });
      for (let i = 0; i < 7; i++) {
        const geo = new THREE.PlaneGeometry(2.4, 0.6, 8, 1);
        geo.translate(1.2, 0, 0);
        const pos = geo.attributes.position;
        for (let k = 0; k < pos.count; k++) {
          const px = pos.getX(k), w = pos.getY(k) * (1 - px / 2.7);
          pos.setXYZ(k, px, -0.16 * px * px + 0.25 * px, w);
        }
        geo.computeVertexNormals();
        const leaf = new THREE.Mesh(geo, leafMat);
        leaf.position.set(x, y, 0);
        leaf.rotation.y = i * Math.PI * 2 / 7 + 0.3;
        g.add(leaf);
      }
      for (let i = 0; i < 3; i++) {
        g.add(at(toon(new THREE.SphereGeometry(0.13, 7, 5), '#6b4226', 0.025), x + Math.cos(i * 2.1) * 0.18, y - 0.12, Math.sin(i * 2.1) * 0.18));
      }
      g.add(blob(2.2));
      return g;
    }
    function makeOasis(big) {
      const g = new THREE.Group();
      const R = big ? 8 : 6;
      const flat = geo => geo.rotateX(-Math.PI / 2);
      g.add(at(new THREE.Mesh(flat(new THREE.CircleGeometry(R + 3.2, 40)), lambert('#4f9a3c')), 0, 0.02, 0));
      g.add(at(new THREE.Mesh(flat(new THREE.CircleGeometry(R + 2.9, 40)), lambert('#a6d86a')), 0, 0.025, 0));
      g.add(at(new THREE.Mesh(flat(new THREE.CircleGeometry(R + 0.7, 40)), lambert(C['sand-light'])), 0, 0.03, 0));
      const water = new THREE.Mesh(flat(new THREE.CircleGeometry(R, 40)),
        new THREE.MeshPhongMaterial({ color: col('#3d9bf0'), emissive: col('#123a80'), shininess: 80, specular: col('#ffffff') }));
      g.add(at(water, 0, 0.04, 0));
      g.add(at(new THREE.Mesh(flat(new THREE.RingGeometry(R * 0.55, R * 0.62, 40)),
        new THREE.MeshBasicMaterial({ color: col(C['blue-light']), transparent: true, opacity: 0.45 })), 0, 0.05, 0));
      const rnd = seeded(big ? 3 : 4);
      const tuft = new THREE.ConeGeometry(0.14, 0.5, 5).translate(0, 0.25, 0);
      for (let i = 0; i < (big ? 40 : 26); i++) {             // 풀 포기
        const a = rnd() * Math.PI * 2, r = R + 1 + rnd() * 1.8;
        g.add(at(new THREE.Mesh(tuft, lambert(i % 2 ? C.grass : '#7cc25a')), Math.cos(a) * r, 0, Math.sin(a) * r));
      }
      if (big) {                                              // 꽃
        const flower = new THREE.SphereGeometry(0.16, 6, 4);
        for (let i = 0; i < 30; i++) {
          const a = rnd() * Math.PI * 2, r = R + 1 + rnd() * 1.9;
          g.add(at(new THREE.Mesh(flower, lambert(['#ff8fa3', C.sun, '#ffffff'][i % 3])), Math.cos(a) * r, 0.3, Math.sin(a) * r));
        }
      }
      const palms = big ? 11 : 7;
      for (let i = 0; i < palms; i++) {                       // 연못 둘레 야자수 (앞쪽은 비워 공룡이 보이게)
        const a = Math.PI * (1.05 + 0.9 * i / (palms - 1)) + (rnd() - 0.5) * 0.1;
        const r = R + 1.6 + rnd() * 1.2;
        const p = makePalm(between(4, 5.6), (rnd() - 0.5) * 1.6);
        p.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
        p.rotation.y = rnd() * 6;
        g.add(p);
      }
      for (const side of [-1, 1]) {                           // 앞쪽 양옆에도 한 그루씩
        const p = makePalm(4.6, side * 0.7);
        p.position.set(side * (R + 2.2), 0, R * 0.5);
        g.add(p);
      }
      g.userData.R = R;
      g.visible = false;
      scene.add(g);
      return g;
    }
    const oasis = [makeOasis(false), makeOasis(true)];
    const oasisNow = () => oasis[stage === LAST ? 1 : 0];

    // ── 화면 크기 ──
    function resize() {
      const r = stageBox.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(r.width, r.height, false);
      camera.aspect = r.width / r.height;
      camera.updateProjectionMatrix();
      fxCanvas.width = Math.round(r.width * dpr);
      fxCanvas.height = Math.round(r.height * dpr);
      const s = fxCanvas.width / W;
      H = fxCanvas.height / s;
      ctx.setTransform(s, 0, 0, s, 0, 0);
      placeCamera(0);
      paintSky();
      render();
    }

    // 3D 위치 → 효과 캔버스 좌표
    const tmpV = new THREE.Vector3();
    function toScreen(x, y, d) {
      tmpV.set(x, y, -d).project(camera);
      return { x: (tmpV.x + 1) / 2 * W, y: (1 - tmpV.y) / 2 * H };
    }

    // 하늘 그림: 카메라에서 본 지평선 높이에 맞춰 그린다 (단계마다 해 높이·색·별이 다름)
    function paintSky() {
      const k = 1.5;
      skyCanvas.width = Math.round(W * k);
      skyCanvas.height = Math.round(H * k);
      const g = skyCanvas.getContext('2d');
      g.setTransform(k, 0, 0, k, 0, 0);
      const st = STAGES[stage];
      const horizonY = toScreen(camX, 0, 2000).y;
      const sky = g.createLinearGradient(0, 0, 0, horizonY);
      sky.addColorStop(0, C['dusk-top']);
      sky.addColorStop(st.sky[0], C['dusk-mid']);
      sky.addColorStop(st.sky[1], C['dusk-low']);
      sky.addColorStop(1, C['dusk-glow']);
      g.fillStyle = sky;
      g.fillRect(0, 0, W, horizonY);
      g.fillStyle = C['dusk-glow'];                   // 지평선 아래는 안개 색 (땅 끝과 이어짐)
      g.fillRect(0, horizonY, W, H - horizonY);
      const rnd = seeded(7);
      const band = horizonY * 0.5;
      g.fillStyle = '#fff';
      for (let i = 0; i < 30; i++) {
        const x = rnd() * W, y = 70 + rnd() * band;
        g.globalAlpha = Math.min(1, (0.25 + rnd() * 0.55 * (1 - (y - 70) / band)) * st.stars);
        const size = rnd() > 0.85 ? 2 : 1.2;
        g.fillRect(x, y, size, size);
      }
      g.globalAlpha = 1;
      const sunX = W / 2, sunY = horizonY - st.sun, sunR = 54;
      const glow = g.createRadialGradient(sunX, sunY, sunR * 0.6, sunX, sunY, sunR * 2.4);
      glow.addColorStop(0, 'rgba(255, 210, 120, .45)');
      glow.addColorStop(1, 'rgba(255, 210, 120, 0)');
      g.fillStyle = glow;
      g.fillRect(0, sunY - sunR * 2.4, W, horizonY - (sunY - sunR * 2.4));
      const sunFill = g.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
      sunFill.addColorStop(0, C.sun);
      sunFill.addColorStop(1, C['sun-low']);
      g.fillStyle = sunFill;
      g.beginPath();
      g.arc(sunX, sunY, sunR, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = sky;
      for (let i = 0, y = Math.max(sunY - 20, sunY - sunR); y < horizonY; i++, y += 8 + i) g.fillRect(sunX - sunR, y, sunR * 2, 2 + i * 0.9);
      const mesa = (color, h, pts) => {
        g.fillStyle = color;
        g.beginPath();
        g.moveTo(0, horizonY + 1);
        for (const [x, dd] of pts) g.lineTo(x, horizonY - h + dd);
        g.lineTo(W, horizonY + 1);
        g.fill();
      };
      mesa(C['mesa-far'], 60, [[0, 24], [22, 24], [30, 42], [78, 42], [86, 24], [118, 24], [124, 40], [236, 40], [244, 32], [292, 32], [300, 14], [330, 14], [336, 28], [360, 28]]);
      mesa(C.mesa, 28, [[0, 12], [40, 12], [46, 22], [96, 22], [102, 8], [134, 8], [140, 28], [220, 28], [226, 6], [262, 6], [266, 13], [310, 13], [316, 18], [348, 18], [352, 10], [360, 10]]);
      skyTex.needsUpdate = true;
    }

    // ── 카메라: 공룡 뒤에서 따라감. 빠를수록 시야가 넓어지고, 도착하면 가까이 ──
    function placeCamera(dt) {
      const k = Math.min(1, dt * 4);
      camX += (dino.x * 0.45 - camX) * (dt ? k : 1);
      const fovGoal = 58 + (speedX() - 1) * 8 + (rocketT > 0 ? 6 : 0) - (state === 'goal' ? 6 : 0);
      camera.fov += (fovGoal - camera.fov) * (dt ? Math.min(1, dt * 3) : 1);
      camera.updateProjectionMatrix();
      const a = shakeT > 0 && !calm ? shakeAmp * (shakeT / shakeDur) * 0.03 : 0;
      const bob = !calm && state === 'play' && dino.y === 0 && rocketT <= 0 ? Math.abs(Math.sin(stepPhase / STEP_SEC * Math.PI)) * 0.06 : 0;
      const near = state === 'goal' ? Math.min(1, goalT / COAST_SEC) : 0;  // 도착하면 카메라가 공룡 쪽으로 다가감
      camera.position.set(camX + between(-a, a), CAM_Y - near * 1.1 + dino.y * 0.3 + bob + between(-a, a), CAM_BACK - near * 2.2);
      camera.lookAt(camX * 0.7, 0.9 + dino.y * 0.25 + near * 0.3, -12 + near * 8);
      camera.updateMatrixWorld();
    }

    // ── 매 프레임 그리기 ──
    function render() {
      // 공룡 그림 고르기: 달리는 방향(땅 기준)으로 뒷모습·비스듬한 모습, 도착하면 정면
      const air = dino.y > 0 || dino.vy !== 0 || rocketT > 0;
      const step = Math.floor(stepPhase / STEP_SEC) % 2;
      const turn = Math.atan2(dino.vx, speedNow() * 1.0 + 0.01);
      let tex;
      if (state === 'over') tex = TEX.dizzy;
      else if (state === 'goal' && goalT > COAST_SEC) tex = air ? TEX.cheerUp : TEX.cheerDown;
      else if (turn < -0.32) tex = air ? TEX.leftAir : TEX.left[step];
      else if (turn > 0.32) tex = air ? TEX.rightAir : TEX.right[step];
      else tex = air ? TEX.backAir : TEX.back[step];
      dinoSprite.material.map = tex;
      dinoSprite.material.rotation = state === 'play' ? clamp(-dino.vx * 0.012, -0.12, 0.12) : 0; // 옆으로 갈 때 살짝 기울기
      const sq = jelly.s;                                 // 젤리처럼 찌그러지고 늘어나기 (발은 바닥에 붙은 채)
      dinoSprite.scale.set(DINO_SIZE * (1 + sq * 0.8), DINO_SIZE * (1 - sq), 1);
      const hop = state === 'play' && dino.y === 0 && rocketT <= 0
        ? Math.abs(Math.sin(stepPhase / STEP_SEC * Math.PI)) * STEP_HOP * (calm ? 0.3 : 1) : 0;
      dinoSprite.position.set(dino.x, dino.y + hop, -dino.d);
      dinoSprite.visible = !(hurtT > 0 && state === 'play' && Math.floor(hurtT / 0.08) % 2);
      const lift = Math.min((dino.y + hop) / 1.5, 1);
      dinoShadow.position.set(dino.x, 0.02, -dino.d);
      dinoShadow.scale.set(1.2 * (1 - lift * 0.5), 1, 0.8 * (1 - lift * 0.5));
      rocketPack.visible = rocketT > 0;
      rocketPack.position.set(dino.x, dino.y + 0.55, -dino.d + 0.25);
      bubbleMesh.visible = shieldT > 0 && (shieldT > 1 || Math.floor(clock / 0.1) % 2 === 0);
      bubbleMesh.position.set(dino.x, dino.y + 0.8, -dino.d);
      bubbleMesh.scale.set(1.05, 1.05, 0.7);
      marker.visible = state === 'play';
      marker.position.set(target.x, 0.03, -target.d);

      // 다가오는 것들
      for (const t of things) {
        t.obj.position.set(t.x, 0, -t.d);
        const sp = t.obj.userData.sprite;
        const m = calm ? 0.3 : 1;
        if (t.kind === 'cactus') {                        // 선인장: 말랑말랑 흔들
          const w = Math.sin(clock * 7 + t.x * 3) * 0.04 * m;
          t.obj.scale.set(1 + w * 0.6, 1 - w, 1 + w * 0.6);
        }
        if (t.kind === 'scorpion') {                      // 전갈: 통통 뛰며 다가옴, 닿는 순간 납작
          sp.material.map = TEX.scorpion[Math.floor(clock / 0.18) % 2];
          const ph = Math.sin(clock * 9 + t.x), size = t.obj.userData.size;
          sp.position.y = Math.abs(ph) * 0.22 * m;
          const w = (1 - Math.abs(ph)) * 0.16 * m;
          sp.scale.set(size * (1 + w * 0.8), size * (1 - w), 1);
        }
        if (t.kind === 'vulture') {                       // 독수리: 날갯짓마다 출렁
          sp.material.map = TEX.vulture[Math.floor(clock / 0.2) % 2];
          const ph = Math.sin(clock * Math.PI / 0.2), size = t.obj.userData.size;
          sp.position.y = t.obj.userData.lift + ph * 0.12 * m;
          sp.scale.set(size * (1 - ph * 0.05 * m), size * (1 + ph * 0.07 * m), 1);
        }
        if (t.kind === 'item') {                          // 아이템: 둥실둥실 돌며 숨 쉬듯 늘었다 줄었다
          const b = Math.sin(clock * 9 + t.x) * 0.1 * m, size = t.obj.userData.size;
          sp.position.y = 0.45 + Math.sin(clock * 5 + t.x) * 0.15;
          sp.scale.set(size * Math.cos(clock * 3 + t.x) * (1 - b * 0.6), size * (1 + b), 1);
        }
      }
      // 길가 말뚝·돌멩이 (오아시스 너머에는 안 보이게)
      const limit = goalD() + 1;
      for (const p of posts) {
        const d = ((p.userData.i * POST_GAP - travel) % (posts.length / 2 * POST_GAP) + posts.length / 2 * POST_GAP) % (posts.length / 2 * POST_GAP) - 8;
        p.position.set(p.userData.side * POST_X, 0, -d);
        p.visible = d < limit - 4;
      }
      for (const r of decor) {
        r.position.set(r.userData.x, 0.1, -r.userData.d);
        r.visible = r.userData.d < limit;
      }
      const o = oasisNow();
      for (const g of oasis) g.visible = g === o && goalD() < GOAL_VIEW;
      o.position.set(0, 0, -goalD());

      renderer.render(scene, camera);

      // 2D 효과
      ctx.clearRect(0, 0, W, H);
      drawSpeedLines();
      for (const t of things) {
        if (t.alarm > 0 && Math.floor(clock / 0.12) % 2 === 0) {
          const p = toScreen(t.x, t.y0 + (t.kind === 'vulture' ? 1.6 : 1.3), t.d);
          drawAlarm(p.x, p.y, clamp(30 / Math.max(t.d + CAM_BACK, 1) * 4, 9, 20));
        }
      }
      drawRings();
      drawParts();
      if (shieldT > 0) {                                   // 거품 둘레를 도는 반짝이
        const c = toScreen(dino.x, dino.y + 0.8, dino.d);
        for (let i = 0; i < 3; i++) {
          const a = clock * 4 + i * 2.09;
          star(c.x + Math.cos(a) * 46, c.y + Math.sin(a) * 40, 4, '#fff');
        }
      }
      const head = toScreen(dino.x, dino.y + DINO_SIZE * 0.95, dino.d);
      if (state === 'goal' && goalT > COAST_SEC) bubble(head.x + 30, head.y - 2, stage === LAST ? '오아시스다!' : '야호!');
      if (state === 'over') {
        for (let i = 0; i < 3; i++) {
          const a = clock * 6 + i * 2.09;
          star(head.x + Math.cos(a) * 26, head.y + 6 + Math.sin(a) * 7, 5, C.sun);
        }
      }
      if (dimT > 0) {
        ctx.fillStyle = `rgba(20, 8, 40, ${Math.min(1, dimT / 0.25) * 0.5})`;
        ctx.fillRect(0, 0, W, H);
      }
      drawBolts();
      if (flash.t > 0) {
        ctx.fillStyle = `rgba(${flash.rgb}, ${flash.t / flash.life * flash.a})`;
        ctx.fillRect(0, 0, W, H);
      }
      drawFlyers();
    }

    // 속도선: 지평선 가운데에서 바깥으로 뻗는 흰 줄. 빠를수록·로켓일 때 많아진다
    function drawSpeedLines() {
      if (calm || state !== 'play') return;
      const n = rocketT > 0 ? 24 : Math.min(14, 3 + Math.floor((speedX() - 1) * 10));
      const vp = toScreen(camX, 0.5, 300);
      ctx.strokeStyle = rocketT > 0 ? 'rgba(255, 250, 235, .6)' : 'rgba(255, 250, 235, .32)';
      ctx.lineWidth = rocketT > 0 ? 2.5 : 1.5;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        let a = between(0.08, 0.92) * Math.PI;
        if (Math.abs(a - Math.PI / 2) < 0.14 * Math.PI) a += (a < Math.PI / 2 ? -1 : 1) * 0.14 * Math.PI;
        if (rocketT > 0 && i % 3 === 0) a = -a;
        const r0 = between(90, 260), len = between(40, rocketT > 0 ? 190 : 110);
        ctx.moveTo(vp.x + Math.cos(a) * r0, vp.y + Math.sin(a) * r0);
        ctx.lineTo(vp.x + Math.cos(a) * (r0 + len), vp.y + Math.sin(a) * (r0 + len));
      }
      ctx.stroke();
    }

    function drawAlarm(x, y, sz) {
      ctx.fillStyle = C.alarm;
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(1, sz * 0.12);
      ctx.beginPath();
      ctx.roundRect(x - sz * 0.45, y - sz * 1.3, sz * 0.9, sz * 1.3, sz * 0.3);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - sz * 0.12, y - sz * 1.12, sz * 0.24, sz * 0.62);
      ctx.fillRect(x - sz * 0.12, y - sz * 0.38, sz * 0.24, sz * 0.2);
    }

    // 공룡 머리 오른쪽 위 말풍선 (도착했을 때)
    function bubble(x, y, text) {
      ctx.font = '17px Jua, sans-serif';
      const w = ctx.measureText(text).width + 22, h = 30;
      const left = Math.min(W - 8 - w, x), top = y - h;
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(left, top, w, h, 12);
      ctx.moveTo(x + 6, top + h - 1);
      ctx.lineTo(x - 6, top + h + 10);
      ctx.lineTo(x + 16, top + h - 1);
      ctx.fill();
      ctx.stroke();
      ctx.fillRect(x + 4, top + h - 4, 14, 4);
      ctx.fillStyle = INK;
      ctx.textAlign = 'center';
      ctx.fillText(text, left + w / 2, top + h / 2 + 6);
    }

    // 십자 모양 별
    function star(x, y, r, color) {
      ctx.fillStyle = INK;
      ctx.fillRect(x - r - 1, y - 2.5, r * 2 + 2, 5);
      ctx.fillRect(x - 2.5, y - r - 1, 5, r * 2 + 2);
      ctx.fillStyle = color;
      ctx.fillRect(x - r, y - 1.5, r * 2, 3);
      ctx.fillRect(x - 1.5, y - r, 3, r * 2);
    }

    // ── 화면 효과: 조각·먼지·글씨·고리·번개·흔들림 ──
    function burst(x, y, colors, n, speed = 1) {
      for (let i = 0; i < n && parts.length < MAX_PARTS; i++) {
        const a = Math.random() * Math.PI * 2, v = between(60, 220) * speed;
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0, life: between(0.4, 0.8), c: anyOf(colors), s: between(2, 5), g: 600 });
      }
    }
    function dust(n, spread = 1) {
      const p = toScreen(dino.x, 0, dino.d);
      for (let i = 0; i < n && parts.length < MAX_PARTS; i++) {
        const side = Math.random() < 0.5 ? -1 : 1;
        parts.push({ x: p.x + between(-10, 10), y: p.y - between(0, 4), vx: side * between(30, 110) * spread, vy: between(-60, -10),
          t: 0, life: between(0.3, 0.55), c: anyOf([C['sand-light'], C.sand, '#fff1d6']), s: between(3, 6), g: 160 });
      }
    }
    function popText(text, x, y, color = '#fff') {
      pops.push({ text, x, y, t: 0, color });
    }
    function ring(x, y, color, { r = 10, grow = 120, life = 0.45, delay = 0, flat = 1, width = 4 } = {}) {
      rings.push({ x, y, color, r, grow, life, t: -delay, flat, width });
    }
    function strike(x, y) {
      const sx = x + between(-50, 50);
      const pts = [[sx, -10]];
      for (let i = 1; i < 9; i++) {
        const k = i / 9;
        pts.push([sx + (x - sx) * k + between(-18, 18), -10 + (y + 10) * k]);
      }
      pts.push([x, y]);
      let [bx, by] = pts[3 + Math.floor(Math.random() * 3)];
      const branch = [[bx, by]];
      for (let i = 0; i < 3; i++) {
        bx += between(-28, 28);
        by += between(14, 30);
        branch.push([bx, by]);
      }
      bolts.push({ pts, branch, t: 0, life: 0.45 });
    }
    function shake(amp, dur) {
      if (shakeT > 0 && amp < shakeAmp * (shakeT / shakeDur)) return;
      shakeAmp = amp;
      shakeT = shakeDur = dur;
    }
    function flashScreen(rgb, a, dur) {
      flash = { rgb, a, t: dur, life: dur };
    }
    function flyTo(img, x, y) {
      const sr = stageBox.getBoundingClientRect(), br = itemBtn.getBoundingClientRect(), k = W / sr.width;
      flyers.push({ img, x0: x, y0: y, x1: (br.left + br.width / 2 - sr.left) * k, y1: (br.top + br.height / 2 - sr.top) * k, t: 0, life: 0.55 });
    }
    function bump(el, cls) {
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
    }
    function showBanner(text, small, color) {
      bannerEl.innerHTML = '';
      bannerEl.append(text);
      if (small) {
        const s = document.createElement('small');
        s.textContent = small;
        bannerEl.append(s);
      }
      bannerEl.style.color = color;
      bump(bannerEl, 'show');
    }
    function stepFx(dt) {
      for (const p of parts) {
        p.t += dt;
        p.vy += p.g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      for (let i = parts.length - 1; i >= 0; i--) if (parts[i].t >= parts[i].life) parts.splice(i, 1);
      for (const p of pops) p.t += dt;
      while (pops.length && pops[0].t > 0.9) pops.shift();
      for (const g of rings) g.t += dt;
      for (let i = rings.length - 1; i >= 0; i--) if (rings[i].t >= rings[i].life) rings.splice(i, 1);
      for (const b of bolts) b.t += dt;
      for (let i = bolts.length - 1; i >= 0; i--) if (bolts[i].t >= bolts[i].life) bolts.splice(i, 1);
      for (const f of flyers) f.t += dt;
      for (let i = flyers.length - 1; i >= 0; i--) {
        if (flyers[i].t < flyers[i].life) continue;
        flyers.splice(i, 1);
        bump(itemBtn, 'bump');
      }
      if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
      if (flash.t > 0) flash.t = Math.max(0, flash.t - dt);
      if (dimT > 0) dimT = Math.max(0, dimT - dt);
    }
    function drawParts() {
      for (const p of parts) {
        ctx.globalAlpha = 1 - p.t / p.life;
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
      }
      ctx.globalAlpha = 1;
      ctx.font = '18px Jua, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineJoin = 'round';
      for (const p of pops) {
        const y = p.y - p.t * 40;
        ctx.globalAlpha = Math.min(1, (0.9 - p.t) * 3);
        ctx.lineWidth = 4;
        ctx.strokeStyle = INK;
        ctx.strokeText(p.text, p.x, y);
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, p.x, y);
      }
      ctx.globalAlpha = 1;
    }
    function drawRings() {
      for (const g of rings) {
        if (g.t < 0) continue;
        const k = g.t / g.life;
        const r = g.r + g.grow * (1 - (1 - k) * (1 - k));
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = g.color;
        ctx.lineWidth = g.width * (1 - k * 0.6);
        ctx.beginPath();
        ctx.ellipse(g.x, g.y, r, r * g.flat, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    function drawBolts() {
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      for (const b of bolts) {
        if (b.t > 0.1 && Math.floor(b.t / 0.05) % 2) continue;
        ctx.globalAlpha = 1 - b.t / b.life * 0.6;
        for (const [w, c] of [[10, 'rgba(255, 230, 120, .4)'], [4.5, C.bolt], [1.8, '#fff']]) {
          ctx.lineWidth = w;
          ctx.strokeStyle = c;
          for (const line of [b.pts, b.branch]) {
            ctx.beginPath();
            line.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
            ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
    }
    function drawFlyers() {
      for (const f of flyers) {
        const k = Math.min(1, f.t / f.life), e = k * k * (3 - 2 * k);
        const x = f.x0 + (f.x1 - f.x0) * e, y = f.y0 + (f.y1 - f.y0) * e - Math.sin(k * Math.PI) * 70;
        const sz = 44 - 14 * k;
        if (f.img.complete) ctx.drawImage(f.img, x - sz / 2, y - sz / 2, sz, sz);
      }
    }

    // 화면에서 그 물건이 보이는 가운데 자리
    function screenOf(t) {
      return toScreen(t.x, t.y0 + Math.min(t.hitH === Infinity ? 1.6 : t.hitH, 2) / 2 + (t.kind === 'item' ? 0.5 : 0), t.d);
    }
    const COLORS = {
      cactus: () => [C['cactus-green'], C['cactus-light'], C['cactus-dark']],
      pillar: () => [C.rock, C['rock-light'], C['rock-dark']],
      fence: () => [C.wood, C['wood-edge'], '#e2c08a'],
      scorpion: () => [C.villain, C['villain-light'], C['villain-dark']],

    function smash(i, loud = true) {
      const t = things[i];

      burst(p.x, p.y, colors, 22, 1.3);
      burst(p.x, p.y, ['#fff', C.sun], 8);
      ring(p.x, p.y, '#fff', { r: 6, grow: 70, life: 0.35, width: 5 });
      ring(p.x, p.y, colors[0], { r: 4, grow: 100, life: 0.45, delay: 0.05 });
      bonus += KILL_POINTS;
      popText('+' + KILL_POINTS, p.x, p.y - 10, C.torch);

    // ── 나오는 것들 ──
    function add(kind, x, extra = {}) {
      const t = { kind, x, d: SPAWN_D, pd: SPAWN_D, y0: 0, alarm: 0, dmg: DAMAGE[kind] || 0, depth: 0.3, ...extra };
      scene.add(t.obj);
      things.push(t);
      return t;
    }
    const pickCactus = () => {
      const total = CACTUS_SIZES.reduce((n, s) => n + s.weight, 0);
      let r = Math.random() * total;
      return CACTUS_SIZES.findIndex(s => (r -= s.weight) < 0);
    };
    // 이미 놓인 것들과 겹치지 않는 가로 자리
    function freeX(placed, half) {
      for (let k = 0; k < 20; k++) {
        const x = between(-FIELD + half, FIELD - half);
        if (placed.every(([px, ph]) => Math.abs(px - x) > ph + half + 0.8)) return x;
      }
      return null;
    }
    function spawnWave() {
      const kinds = STAGES[stage].kinds;
      let r = Math.random() * kinds.reduce((n, k) => n + k[1], 0);
      const kind = kinds.find(k => (r -= k[1]) < 0)[0];
      const placed = [];
      const cactus = () => {
        const s = pickCactus(), h = CACTUS_SIZES[s].h;
        const x = freeX(placed, 0.5);
        if (x === null) return;
        add('cactus', x, { obj: cactusModels[s].clone(), hitH: h, halfW: 0.5, dmg: [15, 20, 25][s] });
        placed.push([x, 0.5]);
      };
      if (kind === 'cactus1') cactus();
      if (kind === 'cactus2') for (let i = 0; i < 2 + Math.floor(Math.random() * 2); i++) cactus();
      if (kind === 'pillar') {
        const x = freeX(placed, 0.9);
        add('pillar', x, { obj: pillarModel.clone(), hitH: Infinity, halfW: 0.9, depth: 0.85 });
        placed.push([x, 0.9]);
        if (Math.random() < 0.5) cactus();
      }
      if (kind === 'fence') {
        const x = between(-FIELD + 2.2, FIELD - 2.2);
        add('fence', x, { obj: fenceModel.clone(), hitH: 0.62, halfW: 2.15, depth: 0.2 });
        placed.push([x, 2.15]);
      }
      if (kind === 'scorpion') {
        const x = freeX(placed, 0.6);
        add('scorpion', x, { obj: spriteThing(TEX.scorpion[0], 1.3), hitH: 0.5, halfW: 0.55, depth: 0.4, villain: true });
        placed.push([x, 0.6]);
      }
      if (kind === 'vulture') {
        add('vulture', dino.x, { obj: spriteThing(TEX.vulture[0], 1.9, 0.85), y0: 0.85, hitH: 0.7, halfW: 0.9, depth: 0.4, villain: true, alarm: 1 });
        placed.push([dino.x, 1]);
        sfx.alarm();
        vibe.play('alarm');
      }
      // 아이템은 비어 있는 자리에
      if (nextItem <= 0) {
        const x = freeX(placed, 0.6);
        if (x !== null) {
          const heal = energy < MAX_ENERGY && Math.random() < (energy < 50 ? 0.5 : 0.25);
          const item = heal ? 'chicken' : anyOf(USE_ITEMS);
          add('item', x, { obj: spriteThing(ITEMS[item].tex, 0.95), item, hitH: 0, halfW: 0.6 });
          nextItem = between(ITEM_GAP_MIN, ITEM_GAP_MAX);
        }
      }
      nextWave = between(GAP_MIN, GAP_MAX);
    }

    // 빌런 움직임: 전갈은 가까워지면 한 번 내 쪽으로 옮겨 오고, 독수리는 멀리 있는 동안 계속 나를 따라온다
    function moveVillain(t, dt) {
      if (t.kind === 'scorpion' && !t.turned && t.d < 16) {
        t.turned = true;
        t.tx = clamp(dino.x, -FIELD, FIELD);
        if (Math.abs(t.tx - t.x) > 0.5) {
          t.alarm = 0.7;
          sfx.alarm();
          vibe.play('alarm');
        }
      }
      if (t.kind === 'vulture') {
        if (t.d > 12) t.tx = dino.x;
        else t.alarm = 0;
      }
      if (t.tx !== undefined) {
        const step = (t.kind === 'vulture' ? 3.5 : 3) * dt;
        t.x += clamp(t.tx - t.x, -step, step);
      }
      if (t.kind === 'scorpion' && t.alarm > 0) t.alarm -= dt;
    }

    // ── 효과음 (WebAudio로 직접 합성, 파일 없음) ──
    const sfx = (() => {
      let ac = null, out = null, noiseBuf = null, on = true;
      try { on = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
      function audio() {
        // 사용자가 한 번이라도 누른 뒤에만 오디오를 켠다 (브라우저 자동재생 정책)
        if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return null;
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ac = new AC();
          // 모든 소리를 크게 키운 뒤, 여러 소리가 겹쳐도 찢어지지 않게 압축기를 거쳐 내보낸다
          const comp = ac.createDynamicsCompressor();
          comp.threshold.value = -12;
          comp.knee.value = 10;
          comp.ratio.value = 4;
          out = ac.createGain();
          out.gain.value = SFX_VOLUME;
          out.connect(comp).connect(ac.destination);
        }
        if (ac.state === 'suspended') ac.resume();
        return ac;
      }
      function tone(freq, at, dur, type = 'square', vol = .06, slideTo = 0) {
        if (!on) return;
        const a = audio(); if (!a) return;
        oscAt(freq, a.currentTime + at, dur, type, vol, slideTo, out);
      }
      function oscAt(freq, t, dur, type, vol, slideTo, dest) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + .012);
        g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        o.connect(g).connect(dest);
        o.start(t); o.stop(t + dur + .03);
      }
      // 흰 소음을 걸러서 쉭·쾅·우르릉 소리를 만든다
      function noise(at, dur, vol, filter = 'lowpass', freq = 1000, freqTo = 0) {
        if (!on) return;
        const a = audio(); if (!a) return;
        noiseAt(a.currentTime + at, dur, vol, filter, freq, freqTo, out);
      }
      function noiseAt(t, dur, vol, filter, freq, freqTo, dest) {
        if (!noiseBuf) {
          noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        src.buffer = noiseBuf;
        src.loop = true;
        f.type = filter;
        f.frequency.setValueAtTime(freq, t);
        if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + .015);
        g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        src.connect(f).connect(g).connect(dest);
        src.start(t); src.stop(t + dur + .05);
      }

      // ── 배경 음악: 밝은 장조 3/4 왈츠 칩튠 ──
      // 남극탐험(스케이터스 왈츠 편곡) 같은 느낌으로 새로 만든 곡. 쿵(베이스)-짝-짝(화음) + 멜로디.
      // 8분음표 1칸, 1마디 = 6칸, 16마디 반복. 멜로디는 마디마다 [음(MIDI), 칸 수], 0은 쉼
      const WALTZ = [
        [[76, 4], [79, 2]], [[79, 2], [76, 2], [72, 2]], [[74, 4], [77, 2]], [[77, 2], [74, 2], [71, 2]],
        [[74, 4], [79, 2]], [[77, 2], [76, 2], [74, 2]], [[76, 4], [72, 2]], [[67, 4], [0, 2]],
        [[76, 4], [79, 2]], [[84, 2], [83, 2], [81, 2]], [[81, 4], [77, 2]], [[81, 2], [79, 2], [77, 2]],
        [[76, 4], [79, 2]], [[74, 4], [71, 2]], [[72, 4], [0, 2]], [[0, 2], [67, 2], [71, 2]],
      ];
      const CHORDS = 'CCGGGGCCCCFFCGCC';                                   // 마디마다 화음
      const HARMONY = { C: [48, 64, 67], G: [43, 65, 71], F: [41, 65, 69] }; // [쿵 베이스, 짝짝 두 음]
      const TEMPO = [168, 180, 196];                                       // 단계별 빠르기 (4분음표 BPM)
      const MELODY = [];                                                   // 칸마다 [음, 길이] 또는 null
      WALTZ.forEach(bar => bar.forEach(([n, len]) => {
        MELODY.push(n ? [n, len] : null);
        for (let i = 1; i < len; i++) MELODY.push(null);
      }));
      const midi = n => 440 * Math.pow(2, (n - 69) / 12);
      let mGain = null, mTimer = 0, mStep = 0, mNext = 0, mLevel = 0, want = -1;

      function musicStart() {
        if (!on || want < 0 || mTimer) return;
        const a = audio(); if (!a) return;
        mLevel = want;
        mGain = a.createGain();
        mGain.gain.value = MUSIC_VOLUME;
        mGain.connect(out);
        mStep = 0;
        mNext = a.currentTime + 0.06;
        mTimer = setInterval(schedule, 25);
        schedule();
      }
      // 0.15초 앞까지 음을 미리 예약해 둔다 (타이머가 조금 늦어도 박자가 흔들리지 않게)
      function schedule() {
        if (!mGain) return;
        const eighth = 30 / TEMPO[mLevel];
        while (mNext < ac.currentTime + 0.15) {
          playStep(mStep, mNext, eighth);
          mNext += eighth;
          mStep = (mStep + 1) % MELODY.length;
        }
      }
      function playStep(step, t, e) {
        const m = MELODY[step];
        if (m) {
          oscAt(midi(m[0]), t, m[1] * e * 0.92, 'square', .05, 0, mGain);
          if (mLevel >= 2) oscAt(midi(m[0] + 12), t, m[1] * e * 0.8, 'triangle', .035, 0, mGain); // 3단계: 반짝이는 높은 소리
        }
        const beat = step % 6, [bass, h1, h2] = HARMONY[CHORDS[Math.floor(step / 6)]];
        if (beat === 0) oscAt(midi(bass), t, e * 1.7, 'triangle', .11, 0, mGain);   // 쿵
        if (beat === 2 || beat === 4) {                                                // 짝 짝
          oscAt(midi(h1), t, e * 0.6, 'square', .022, 0, mGain);
          oscAt(midi(h2), t, e * 0.6, 'square', .022, 0, mGain);
          if (mLevel >= 1) noiseAt(t, .03, .02, 'highpass', 7000, 0, mGain);        // 2단계부터 찰랑
        }
      }
      function musicStop(fade) {
        clearInterval(mTimer);
        mTimer = 0;
        if (mGain && ac) {
          const g = mGain;
          g.gain.setTargetAtTime(0.0001, ac.currentTime, Math.max(0.01, fade / 3));
          setTimeout(() => g.disconnect(), (fade + 0.5) * 1000);
        }
        mGain = null;
      }
      // 다른 탭으로 가면 소리를 멈췄다가 돌아오면 이어서
      document.addEventListener('visibilitychange', () => {
        if (!ac) return;
        if (document.hidden) ac.suspend();
        else ac.resume();
      });
      return {
        get on() { return on; },
        toggle() {
          on = !on;
          try { localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); } catch (e) {}
          if (on) musicStart();
          else musicStop(0.1);
          return on;
        },
        music(level) { want = level; musicStop(0.05); musicStart(); }, // 단계 음악 시작 (아직 못 켜면 첫 입력 때)
        musicOff(fade = 0.3) { want = -1; musicStop(fade); },
        wake() { musicStart(); },                  // 첫 누름·키 입력에서 오디오가 허락되면 음악 시작
        tap()       { tone(660, 0, .08, 'square', .05); },
        jump()      { tone(330, 0, .16, 'square', .045, 660); },
        land()      { tone(150, 0, .09, 'triangle', .09, 70); noise(0, .08, .04, 'lowpass', 800); },
        lane()      { noise(0, .09, .05, 'bandpass', 1800, 3500); },
        pickup()    { [880, 1175, 1568].forEach((f, i) => tone(f, i * .06, .12, 'square', .045)); },
        alarm()     { tone(988, 0, .07, 'square', .045); tone(740, .1, .1, 'square', .045); },
        smash()     { noise(0, .22, .14, 'lowpass', 1600, 200); tone(200, 0, .16, 'square', .05, 60); },
        hit()       {
          noise(0, .35, .2, 'lowpass', 1200, 150);
          tone(260, 0, .4, 'sawtooth', .07, 50);
          [392, 349, 311, 262].forEach((f, i) => tone(f, .45 + i * .2, .22, 'triangle', .08, f * .96));
        },
        shield()    { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * .05, .3, 'triangle', .06)); tone(196, 0, .7, 'sine', .07, 392); },
        bolt()      { noise(0, .12, .3, 'highpass', 2000); tone(1400, 0, .3, 'sawtooth', .06, 60); noise(.06, 1.3, .22, 'lowpass', 400, 60); },
        rocket()    {
          tone(90, 0, .6, 'sawtooth', .07, 520);
          noise(0, ROCKET_SEC, .1, 'bandpass', 500, 1400);
          [523, 784, 1047].forEach((f, i) => tone(f, .1 + i * .07, .14, 'square', .04));
        },
        speedup()   { [659, 784, 988, 1319].forEach((f, i) => tone(f, i * .07, .12, 'square', .045)); },
        milestone() { tone(1319, 0, .1, 'square', .04); tone(1760, .08, .16, 'square', .04); },
        hurt()      { noise(0, .2, .16, 'lowpass', 1400, 200); tone(300, 0, .22, 'square', .06, 120); },
        heal()      { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .06, .16, 'triangle', .08)); },
        low()       { tone(440, 0, .12, 'square', .05); tone(330, .16, .18, 'square', .05); },
        stage()     { tone(880, 0, .1, 'square', .05); tone(1175, .12, .2, 'square', .05); },
        hop()       { tone(520, 0, .09, 'triangle', .05, 760); },
        clear()     { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .09, i === 4 ? .45 : .18, 'square', .06)); },
        oasis()     {
          [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * .13, i === 7 ? .8 : .16, 'square', .06));
          [2093, 2637, 3136, 2637, 3136].forEach((f, i) => tone(f, .4 + i * .18, .25, 'triangle', .03));
        },
        best()      { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .12, i === 5 ? .5 : .14, 'square', .06)); },
      };
    })();

    // ── 화면 위 글자·버튼 ──
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overEl = document.getElementById('over');
    const finalEl = document.getElementById('finalScore');
    const newBestEl = document.getElementById('newBest');
    const againBtn = document.getElementById('againBtn');
    const itemBtn = document.getElementById('itemBtn');
    const itemIcon = document.getElementById('itemIcon').getContext('2d');
    const itemCount = document.getElementById('itemCount');
    const effectBar = document.getElementById('effectBar');
    const effectFill = document.getElementById('effectFill');
    const hintEl = document.getElementById('hint');
    const bannerEl = document.getElementById('banner');

    const vibeBtn = document.getElementById('vibeBtn');

    const tripFill = document.getElementById('tripFill');
